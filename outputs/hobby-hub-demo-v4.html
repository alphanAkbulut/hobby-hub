const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v).toLocaleString('tr-TR')+' TL'; const uid=()=> 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const copy=v=>JSON.parse(JSON.stringify(v)); const seed=JSON.parse($('#initial-data').textContent); const KEY='hobbyhub-demo-v4-'+(seed.storageId||'default');
let data=copy(seed), storageOK=true; try{const saved=localStorage.getItem(KEY)||localStorage.getItem('hobbyhub-demo-v3-'+(seed.storageId||'default')); if(saved){const d=JSON.parse(saved);if(d.version===1&&Array.isArray(d.hubs)&&Array.isArray(d.listings)&&Array.isArray(d.entities)&&Array.isArray(d.draftHubs)&&d.hubs.length)data=d;}}catch(e){storageOK=false;}
let state={hub:data.hubs.find(h=>h.active)?.id||data.hubs[0].id,tab:'discover',cat:'',query:'',scope:'all',filters:{},sort:'recommended',admin:false,adminTab:'overview',adminHub:data.draftHubs[0].id,favorites:false,searching:false};
const tabNames={discover:'Genel bakış',creators:'Üreticiler & Koleksiyonerler',market:'İlanlar',content:'İçerikler',service:'Uzmanlar',course:'Eğitim & etkinlik',offer:'Fırsatlar',community:'Topluluk'};
const kindNames={content:'İçerik',service:'Hizmet',course:'Eğitim / etkinlik',offer:'Fırsat',community:'Topluluk'};
const statusNames={published:'Yayında',pending:'İncelemede',rejected:'Reddedildi',hidden:'Gizlendi'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;return true}catch(e){storageOK=false;toast('Tarayıcı kaydına ulaşılamadı. Değişiklikleri “Demoyu indir” ile saklayabilirsin.');return false}}
function toast(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
function audit(action){data.audit.unshift({at:new Date().toLocaleString('tr-TR'),action});data.audit=data.audit.slice(0,80);save()}
function hub(id=state.hub,draft=false){return (draft?data.draftHubs:data.hubs).find(h=>h.id===id)}
function allNodes(h){return h?.categories||[]}function node(id,h=hub()){return allNodes(h).find(c=>c.id===id)}
function descendants(id,h=hub()){const out=new Set([id]);let change=true;while(change){change=false;for(const c of allNodes(h)){if(out.has(c.parent)&&!out.has(c.id)){out.add(c.id);change=true}}}return out}
function path(id,h=hub()){const result=[],seen=new Set;let c=node(id,h);while(c&&!seen.has(c.id)){seen.add(c.id);result.unshift(c.name);c=node(c.parent,h)}return result.join(' › ')}
function visibleListing(l){return l.status==='published'&&hub(l.hub)?.active&&hub(l.hub)?.sections.some(s=>s.id==='market'&&s.enabled)}function visibleEntity(e){return e.status==='published'&&hub(e.hub)?.active&&hub(e.hub)?.sections.some(s=>s.id===e.kind&&s.enabled)}
const fold=s=>String(s).toLocaleLowerCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');
function matchesQuery(item){return !state.query||fold([item.title,item.desc,item.city,item.seller,path(item.cat,hub(item.hub)),hub(item.hub)?.name,...Object.values(item.attrs||{})].join(' ')).includes(fold(state.query))}
function listings(ignoreFilter=''){let list=data.listings.filter(visibleListing).filter(l=>state.searching&&state.scope==='all'?true:l.hub===state.hub).filter(matchesQuery);if(state.favorites)list=list.filter(l=>data.favorites.includes(l.id));if(state.cat)list=list.filter(l=>descendants(state.cat).has(l.cat));for(const [key,value]of Object.entries(state.filters)){if(!value||key===ignoreFilter)continue;if(key==='min')list=list.filter(l=>l.price>=Number(value));else if(key==='max')list=list.filter(l=>l.price<=Number(value));else if(key==='city')list=list.filter(l=>l.city===value);else if(key==='type')list=list.filter(l=>l.type===value);else if(key==='delivery')list=list.filter(l=>l.delivery===value);else list=list.filter(l=>String(l.attrs?.[key]??'').split(',').includes(value));}if(state.sort==='low')list.sort((a,b)=>a.price-b.price);else if(state.sort==='high')list.sort((a,b)=>b.price-a.price);else if(state.sort==='new')list.reverse();else list.sort((a,b)=>(b.promoted?1:0)-(a.promoted?1:0));return list}
function entities(kind){return data.entities.filter(visibleEntity).filter(e=>state.searching&&state.scope==='all'?true:e.hub===state.hub).filter(e=>!kind||e.kind===kind).filter(matchesQuery).sort((a,b)=>(b.promoted?1:0)-(a.promoted?1:0))}
function photo(i,cl='',alt='Örnek ürün görseli'){if(typeof i==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(i))return `<img class="photo ${cl}" src="${i}" alt="${esc(alt)}" loading="lazy" style="object-fit:cover;width:100%">`;return `<div class="photo p${Number(i)||0} ${cl}" role="img" aria-label="${esc(alt)}"></div>`}
function btn(text,action,id='',cl='btn'){return `<button class="${cl}" data-action="${action}" data-id="${esc(id)}">${text}</button>`}
function options(arr,value){return arr.map(v=>{const id=typeof v==='string'?v:v.id,name=typeof v==='string'?v:v.name;return `<option value="${esc(id)}" ${id===value?'selected':''}>${esc(name)}</option>`}).join('')}
function showModal(title,html){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html; if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0}
function closeModal(){$('#modal').close()}
function remember(mode='push'){const p=new URLSearchParams({h:state.hub,t:state.tab});if(state.profile){p.set('u',state.profile);p.set('pt',state.profileTab||'showcase')}if(state.tab==='market'&&state.cat)p.set('c',state.cat);if(state.searching){p.set('q',state.query);p.set('s',state.scope)}if(state.admin)p.set('a',state.adminTab);if(state.favorites)p.set('f','1');if(state.tab==='market'&&Object.values(state.filters).some(Boolean))p.set('filters',JSON.stringify(Object.fromEntries(Object.entries(state.filters).filter(([,v])=>v))));if(state.tab==='market'&&state.sort!=='recommended')p.set('sort',state.sort);const next='#'+p.toString();if(location.hash!==next)history[mode==='replace'?'replaceState':'pushState'](null,'',next)}
function readRoute(){const p=new URLSearchParams(location.hash.slice(1));const hid=hub(p.get('h'))?.active?p.get('h'):data.hubs.find(h=>h.active).id;const h=hub(hid);const tid=p.get('t');state={...state,hub:hid,tab:tid==='discover'||h.sections.some(s=>s.id===tid&&s.enabled)?tid:'discover',cat:'',filters:{},query:p.get('q')||'',searching:p.has('q')&&!!p.get('q'),scope:hub(p.get('s'))?.active?p.get('s'):'all',admin:p.has('a'),adminTab:p.get('a')||'overview',favorites:p.get('f')==='1',sort:'recommended'};if(state.tab==='market'){state.cat=node(p.get('c'),h)?p.get('c'):'';state.sort=['recommended','low','high','new'].includes(p.get('sort'))?p.get('sort'):'recommended';try{const f=JSON.parse(p.get('filters')||'{}');if(f&&typeof f==='object'&&!Array.isArray(f)){const allowed=new Set(['min','max','city','type','delivery',...h.attributes.filter(a=>a.filterable).map(a=>a.id)]);state.filters=Object.fromEntries(Object.entries(f).filter(([k,v])=>allowed.has(k)&&typeof v==='string'&&v.length<=150&&(!['min','max'].includes(k)||v!==''&&Number.isFinite(Number(v))&&Number(v)>=0)))}}catch(e){state.filters={}}}}
function breadcrumb(h){const items=[`<span>Hobiler</span>`];const current=text=>`<span aria-current="page">${esc(text)}</span>`;const link=(text,action,id)=>btn(esc(text),action,id,'linkbtn');if(state.profile){const person=personBySlug(state.profile);items.push(link(h.name,'hub',h.id),link(tabNames.creators,'tab','creators'),state.profileTab==='showcase'?current(person?.name||'Vitrin'):link(person?.name||'Vitrin','profile',state.profile));if(state.profileTab!=='showcase')items.push(current(profileTabNames[state.profileTab]||'Vitrin'));}else if(state.favorites){items.push(current('Kaydettiklerim'));}else{items.push(state.tab==='discover'&&!state.searching?current(h.name):link(h.name,'hub',h.id));if(state.searching)items.push(state.tab==='discover'?current('Arama sonuçları'):'<span>Arama sonuçları</span>');if(state.tab!=='discover'){if(state.tab==='market'&&state.cat){items.push(link(tabNames.market,'category',''));const chain=[],seen=new Set();let c=node(state.cat,h);while(c&&!seen.has(c.id)){seen.add(c.id);chain.unshift(c);c=node(c.parent,h)}items.push(...chain.map((c,i)=>i===chain.length-1?current(c.name):link(c.name,'category',c.id)));}else items.push(current(tabNames[state.tab]));}}return `<nav class="crumb" aria-label="İçerik yolu">${items.join('<span aria-hidden="true">›</span>')}</nav>`}

function goHub(id){state={...state,profile:'',profileTab:'showcase',hub:id,tab:'discover',cat:'',query:'',filters:{},sort:'recommended',scope:'all',admin:false,favorites:false,searching:false};render()}
function render(historyMode='push'){if(!hub()?.active){state.hub=data.hubs.find(h=>h.active)?.id||data.hubs[0].id}const h=hub();if(state.profile&&!h.sections.some(s=>s.id==='creators'&&s.enabled)){state.profile='';state.profileTab='showcase'}if(state.tab!=='discover'&&!h.sections.some(s=>s.id===state.tab&&s.enabled))state.tab='discover';if(state.tab!=='market'){state.cat='';state.filters={};state.sort='recommended'}document.title=state.profile?`${personBySlug(state.profile)?.name||'Vitrin'} · ${profileTabNames[state.profileTab]||'Vitrin'} | Hobby Hub`:`${h.name} · ${state.favorites?'Kaydettiklerim':tabNames[state.tab]} | Hobby Hub`;$('#hubnav').innerHTML=data.hubs.filter(h=>h.active).map(h=>`<button data-action="hub" data-id="${esc(h.id)}" class="${!state.admin&&state.hub===h.id?'active':''}">${esc(h.symbol)} &nbsp;${esc(h.name)}</button>`).join('')+(canAdmin()?`<button class="admin-link ${state.admin?'active':''}" data-action="admin">⚙ Backoffice</button>`:'');$('#search-scope').innerHTML='<option value="all">Tüm hobiler</option>'+options(data.hubs.filter(h=>h.active),state.scope);$('#search-scope').value=state.scope;$('#search-input').value=state.query;$('#fav-count').textContent=data.favorites.length||'';$('#app').innerHTML=state.admin?adminView():`<div class="shell"><aside class="sidebar" id="sidebar" aria-label="Kategori ve filtreler">${sidebar(h)}</aside><main id="main" tabindex="-1">${userView(h)}</main></div>`;remember(historyMode)}
function tree(h,parent='',depth=0){return allNodes(h).filter(c=>c.parent===parent).map(c=>{const kids=allNodes(h).some(n=>n.parent===c.id);const count=data.listings.filter(l=>visibleListing(l)&&l.hub===h.id&&descendants(c.id,h).has(l.cat)).length;const b=`<button data-action="category" data-id="${esc(c.id)}" class="node ${state.cat===c.id?'active':''}"><span>${esc(c.name)}</span><small>${count}</small></button>`;return kids?`<details ${depth<1||descendants(c.id,h).has(state.cat)?'open':''}><summary>${esc(c.name)} <small>(${count})</small></summary><div class="branch">${b}${tree(h,c.id,depth+1)}</div></details>`:b}).join('')}
function facetSelect(label,key,vals){return `<div class="facet"><h3>${esc(label)}</h3><select data-filter="${esc(key)}" aria-label="${esc(label)}"><option value="">Tümü</option>${vals.map(v=>`<option value="${esc(v)}" ${state.filters[key]===v?'selected':''}>${esc(v)} (${listings(key).filter(l=>(key==='city'||key==='type'||key==='delivery'?l[key]:String(l.attrs?.[key]??'').split(',').includes(v)?v:'')===v).length})</option>`).join('')}</select></div>`}
function sidebar(h){const allSearch=state.searching&&state.scope==='all';const market=state.tab==='market'||state.favorites;return `${btn('Kapat','filters-close','','btn mobile-close')}<h2>${esc(h.name)} · Keşfet</h2><nav class="explore-nav" aria-label="Keşif alanları"><button data-action="tab" data-id="discover" class="${state.tab==='discover'?'active':''}" aria-current="${state.tab==='discover'?'page':'false'}"><span>◈ &nbsp;${tabNames.discover}</span></button>${h.sections.filter(s=>s.enabled).map(s=>{const count=s.id==='creators'?peopleInHub(h.id).length:s.id==='market'?data.listings.filter(l=>visibleListing(l)&&l.hub===h.id).length:data.entities.filter(e=>visibleEntity(e)&&e.hub===h.id&&e.kind===s.id).length;return `<button data-action="tab" data-id="${s.id}" class="${state.tab===s.id?'active':''}" aria-current="${state.tab===s.id?'page':'false'}"><span>${{fit:'✿',creators:'♧',content:'◫',service:'◎',course:'▦',community:'◌',market:'▤',offer:'◇'}[s.id]} &nbsp;${tabNames[s.id]}</span><small>${count}</small></button>`}).join('')}</nav><div class="block"><h2>İlan kategorileri</h2>${allSearch?`<p class="muted" style="font-size:14px">Tüm hobilerde aranıyor. Özel filtreler için arama kapsamından bir hobi seç.</p>`:`<div class="tree"><button data-action="category" data-id="" class="node ${market&&!state.cat?'active':''}"><b>Tüm kategoriler</b><small>${data.listings.filter(l=>visibleListing(l)&&l.hub===h.id).length}</small></button>${tree(h)}</div>`}</div>${market?`<div class="block"><h2>İlan filtreleri</h2><p class="meta">Bu filtreler yalnızca ilanları daraltır.</p><div class="facet"><h3>Fiyat aralığı · TL</h3><form id="price-form"><div class="range"><input type="number" min="0" name="min" placeholder="En az" aria-label="En az fiyat" value="${esc(state.filters.min||'')}"><input type="number" min="0" name="max" placeholder="En çok" aria-label="En çok fiyat" value="${esc(state.filters.max||'')}"></div><button class="linkbtn">Fiyatı uygula</button></form></div>${facetSelect('Konum','city',[...new Set(data.listings.map(l=>l.city))])}${facetSelect('İlan türü','type',[...new Set((allSearch?data.hubs:[h]).flatMap(h=>h.listingTypes))])}${facetSelect('Teslimat','delivery',['Elden teslim','Kargo','Kargo veya elden'])}${!allSearch?h.attributes.filter(a=>a.filterable&&(!a.category||!state.cat||descendants(a.category,h).has(state.cat)||descendants(state.cat,h).has(a.category))).map(a=>a.type==='number'?`<div class="facet"><h3>${esc(a.name)} ${esc(a.unit||'')}</h3><select data-filter="${esc(a.id)}" aria-label="${esc(a.name)}"><option value="">Tümü</option>${options([...new Set(data.listings.filter(l=>l.hub===h.id).map(l=>String(l.attrs[a.id]??'')).filter(Boolean))],state.filters[a.id])}</select></div>`:facetSelect(a.name,a.id,a.type==='boolean'?['Evet','Hayır']:a.options)).join(''):''}${btn('Filtreleri temizle','clear-filters','','linkbtn')}</div>`:''}<div class="block"><div class="overview-tile"><div class="eyebrow">Topluluğa katıl</div><h3>Bir deneyim de senden.</h3><p style="font-size:13px">Koleksiyonunu, yaptıklarını ve öğrendiklerini paylaş.</p>${btn('Deneyimini paylaş','add-media','','linkbtn')}</div></div><div class="block">${btn('♡ Kaydettiklerim','favorites','','linkbtn')}</div>`}
function card(l){return `<article class="card"><div class="cover"><button class="card-img" data-action="listing" data-id="${l.id}" aria-label="${esc(l.title)} detayını aç">${photo(l.image,'',l.title+' — temsili görsel')}</button><button class="fav ${data.favorites.includes(l.id)?'saved':''}" data-action="favorite" data-id="${l.id}" aria-label="${esc(l.title)} ${data.favorites.includes(l.id)?'kaydını kaldır':'kaydet'}" aria-pressed="${data.favorites.includes(l.id)}">${data.favorites.includes(l.id)?'♥':'♡'}</button>${l.promoted?'<span class="pill gold">Sponsorlu</span>':l.type==='Kendi üretimi'?'<span class="pill">Hobi üreticisinden</span>':''}</div><div class="card-body"><span class="meta">${esc(l.seller)} · ${esc(l.city)}</span><button class="card-title" data-action="listing" data-id="${l.id}">${esc(l.title)}</button><div class="row between"><span class="price">${money(l.price)}</span><span class="meta">${esc(l.condition)}</span></div></div></article>`}
function entityCard(e){return `<article class="entity-card">${photo(e.image,'',e.title+' — temsili görsel')}<div class="inside"><div class="row between"><span class="pill ${e.kind==='offer'?'gold':e.kind==='course'?'blue':''}">${esc(e.tag||kindNames[e.kind])}</span>${e.promoted?'<small>Sponsorlu</small>':''}</div><h3 style="margin-top:12px">${esc(e.title)}</h3><p class="muted">${esc(e.summary||e.desc.slice(0,95))}</p><p class="meta">${esc(e.source||e.seller)}${e.city?' · '+esc(e.city):''}</p>${btn(e.kind==='service'?'Uzmanı incele':e.kind==='course'?'Programı gör':e.kind==='offer'?'Koşulları gör':'İncele','entity',e.id,'btn small')}</div></article>`}
function section(kind,limit=3){const records=entities(kind).slice(0,limit);if(!records.length)return '';return `<section class="section"><div class="section-head"><h2>${{content:'Okudukça keşfet',service:'İşini bilen insanlarla tanış',course:'Birlikte öğren, birlikte yap',offer:'Hobine küçük bir avantaj',community:'Topluluktan ilham al'}[kind]}</h2>${btn('Tümünü gör','tab',kind,'linkbtn')}</div><div class="grid3">${records.map(entityCard).join('')}</div></section>`}
function listingResults(){const list=listings();return `<div class="toolbar"><div><b>${list.length} ilan</b> <span class="meta">${state.cat?esc(path(state.cat)):''}</span></div><div class="row">${btn('Aramayı kaydet','save-search','','btn small')}<select id="sort" aria-label="İlan sıralaması">${options([{id:'recommended',name:'Önerilen sıralama'},{id:'new',name:'En yeni'},{id:'low',name:'Fiyat: artan'},{id:'high',name:'Fiyat: azalan'}],state.sort)}</select></div></div><div class="chips">${Object.entries(state.filters).filter(([,v])=>v).map(([k,v])=>btn(esc((hub().attributes.find(a=>a.id===k)?.name||{min:'En az',max:'En çok',city:'Konum',type:'Tür',delivery:'Teslimat'}[k]||k)+': '+v)+' ×','remove-filter',k,'chip active')).join('')}</div>${list.length?`<div class="cards all">${list.map(card).join('')}</div>`:`<div class="empty"><h2>Henüz eşleşen ilan yok</h2><p>Fiyatı genişlet veya bir üst kategoriye dön.</p>${btn('Filtreleri temizle','clear-filters')} ${btn('Tüm ilanları gör','all-listings')}</div>`}`}
function spotlight(h){const c=entities('content')[0],p=entities('service')[0],e=entities('course')[0];if(!c&&!p&&!e)return '';return `<section class="spotlight-section"><div class="section-head"><div><span class="eyebrow muted">Yeni bir fikirle başla</span><h2>Hobinde bugün</h2></div><span class="meta">Oku · Tanış · Katıl</span></div><div class="spotlight">${c?`<article class="story-lead">${photo(c.image,'',c.title+' — temsili görsel')}<div class="story-copy"><span class="pill">OKUMA KÖŞESİ</span><h2>${esc(c.title)}</h2><p>${esc(c.summary)}</p><div class="row between"><span class="meta">${esc(c.source)}</span>${btn('Rehberi oku','entity',c.id,'btn primary')}</div></div></article>`:''}<div class="spotlight-side">${p?`<article class="expert-spot"><div class="row between"><span class="eyebrow">BİR UZMANA DANIŞ</span>${p.promoted?'<span class="pill gold">Sponsorlu</span>':''}</div><div class="row">${avatarMarkup(data.people.find(x=>x.name===p.seller))}<div><b>${esc(p.seller)}</b><div class="meta">${esc(p.city)} · Örnek uzman profili</div></div></div><h3>${esc(p.title)}</h3><div class="row between"><span class="meta">Portfolyosunu keşfet, ihtiyacını konuş.</span>${btn('Uzmanı tanı','entity',p.id,'btn small')}</div></article>`:''}${e?`<article class="event-spot"><div class="date-tile"><b>${esc((e.date||'24 Ekim').split(' ')[0])}</b><span>${esc((e.date||'24 Ekim').split(' ')[1])}</span></div><div><span class="eyebrow">BİRLİKTE ÖĞREN</span><h3>${esc(e.title)}</h3><p class="meta">${esc(e.city)} · ${esc(e.duration||'2 saat')} · ${esc(e.level||'Başlangıç')}</p>${btn('Etkinliği incele','entity',e.id,'linkbtn')}</div></article>`:''}</div></div></section>`}
function communityStrip(){const es=entities('community');if(!es.length)return '';return `<section class="community-strip section"><div class="section-head"><div><span class="eyebrow">TOPLULUĞUN İÇİNDEN</span><h2>Senin gibi meraklılardan.</h2></div>${btn('Deneyimini paylaş','add-media','','btn')}</div><div class="community-items">${es.slice(0,3).map(e=>`<article class="community-mini"><button data-action="entity" data-id="${e.id}" class="media-link" aria-label="${esc(e.title)}">${photo(e.image,'',e.title)}</button><div><h3>${esc(e.title)}</h3><p class="meta">${esc(e.seller)} · ${esc(e.tag||'Deneyim')}</p>${btn('Hikâyeye göz at','entity',e.id,'linkbtn')}</div></article>`).join('')}<div class="community-invite"><b>Sen neler üretiyorsun?</b><p>İyi fikirler paylaştıkça çoğalır.</p>${btn('Topluluğu keşfet','tab','community','linkbtn')}</div></div></section>`}
function discovery(h){const offered=entities('offer')[0];return `${h.sections.some(s=>s.id==='creators'&&s.enabled)?creatorSpotlight(h):''}${spotlight(h)}${h.sections.map(s=>{if(!s.enabled||s.id==='creators'||s.id==='fit')return '';if(s.id==='community')return communityStrip();if(s.id==='market')return `<section class="section market-section"><div class="section-head"><div><span class="eyebrow muted">HOBİCİDEN HOBİCİYE</span><h2>Koleksiyonuna bir parça ekle.</h2><p>Üretilenler, iyi bakılanlar, yeni bir yuva arayanlar.</p></div>${btn('İlanları keşfet ('+listings().length+')','tab','market','btn small')}</div><div class="cards">${listings().slice(0,4).map(card).join('')}</div>${!listings().length?'<div class="empty">İlk ilanı sen paylaşabilirsin.</div>':''}</section>`;if(s.id==='offer')return offered?`<section class="offer-strip section"><div><span class="eyebrow">ÜYELERE ÖZEL · ÖRNEK FIRSAT</span><h3>${esc(offered.title)}</h3><p class="meta">Koşulları açık, sürprizi olmayan teklifler.</p></div>${btn('Fırsatları incele','tab','offer','btn')}</section>`:'';const es=entities(s.id);if(es.length<2)return '';return section(s.id)}).join('')}`}
function userView(h){if(state.profile)return profileView(h);const activeSections=h.sections.filter(s=>s.enabled);if(state.tab!=='discover'&&!activeSections.some(s=>s.id===state.tab))state.tab='discover';return `${breadcrumb(h)}<div class="row between">${btn('☷ Keşif alanları ve kategoriler','filters-open','','btn filter-toggle')}</div>${state.favorites?`<h1 style="margin-top:15px">Kaydettiklerim</h1><p class="muted">Bu cihazda kaydettiğin ilanlar · Tüm hobiler</p>`:state.searching?`<h1 style="margin-top:15px">“${esc(state.query)}” için sonuçlar</h1><p class="muted">${state.scope==='all'?'Tüm hobilerde':esc(h.name)+' içinde'} içerikler, uzmanlar, etkinlikler ve ilanlar</p>`:state.tab==='discover'?`<section class="hero"><div><span class="eyebrow">${esc(h.kicker)}</span><h1>${esc(h.headline)}</h1><p>${esc(h.subtitle)}</p></div><div class="hub-note"><span class="hub-monogram">${esc(h.symbol)}</span><span>Keşfet.<br>Öğren. Paylaş.</span></div></section>`:`<div class="row between"><h1>${state.cat&&state.tab==='market'?esc(node(state.cat)?.name):esc(h.name)+' · '+tabNames[state.tab]}</h1>${btn('Hub’a dön','tab','discover','btn small')}</div>`}<nav class="tabs" aria-label="Hobi bölümleri">${[{id:'discover',name:tabNames.discover},...activeSections.map(s=>({id:s.id,name:tabNames[s.id]}))].map(s=>`<button data-action="tab" data-id="${s.id}" class="${state.tab===s.id?'active':''}" aria-current="${state.tab===s.id?'page':'false'}">${s.name}</button>`).join('')}</nav>${state.tab==='creators'?creatorsView(h):state.favorites||state.tab==='market'?listingResults():state.searching&&state.tab==='discover'?`${['content','service','course','community','offer'].map(k=>{const es=entities(k);return es.length?`<section class="result-group"><h2>${tabNames[k]} <small>(${es.length})</small></h2><div class="grid3">${es.map(entityCard).join('')}</div></section>`:''}).join('')}<section class="result-group"><h2>İlanlar</h2>${listingResults()}</section>`:state.tab==='discover'?discovery(h):`${state.tab==='community'?`<div class="row between"><p class="muted">Koleksiyonlar, atölyeler ve kullananlardan.</p>${btn('+ Deneyimini paylaş','add-media','','btn')}</div>`:''}<div class="grid3">${entities(state.tab).map(entityCard).join('')}</div>${!entities(state.tab).length?'<div class="empty"><h2>Burada henüz içerik yok</h2><p>Yeni içerikler moderasyon sonrası görünecek.</p></div>':''}`}`}

function listingDetail(id){const l=data.listings.find(l=>l.id===id);if(!l||!visibleListing(l)){toast('Bu ilan artık yayında değil.');render();return}const h=hub(l.hub);showModal('İlan detayı · Örnek ilan',`<div class="detail-grid">${photo(l.image,'',l.title+' — AI temsili görsel')}<div><span class="pill">${esc(l.type)}</span><p class="meta" style="margin-top:12px">${esc(h.name)} › ${esc(path(l.cat,h))}</p><h1>${esc(l.title)}</h1><p class="muted">${esc(l.city)} · ${esc(l.condition)}</p><div class="detail-price">${money(l.price)}</div><p>${esc(l.desc)}</p><div class="specs">${h.attributes.filter(a=>l.attrs[a.id]).map(a=>`<div><small>${esc(a.name)}</small><b>${esc(l.attrs[a.id])} ${esc(a.unit||'')}</b></div>`).join('')}<div><small>Teslimat</small><b>${esc(l.delivery)}</b></div></div><div class="row">${btn('Soru sor','qa-ask',l.id,'btn primary')}${btn(data.favorites.includes(l.id)?'♥ Kaydedildi':'♡ Kaydet','favorite',l.id)}</div><p class="terms" style="margin-top:12px">Ödeme ve alıcı koruması bu demoda bulunmaz.</p><div class="mini">${avatarMarkup(data.people.find(x=>x.name===l.seller))}<div><b>${esc(l.seller)}</b><p class="meta" style="margin:0">${esc(l.sellerBio||'Koleksiyonunu ve deneyimini paylaşan hobici.')}</p></div>${btn('Vitrin','seller',l.seller,'linkbtn')}</div></div></div><section class="section"><div class="section-head"><h2>Kullananlardan</h2>${btn('Deneyim ekle','add-media',l.id,'linkbtn')}</div><p class="meta">Temsili kullanım görselleri · Doğrulanmış satın alma değildir.</p><div class="gallery">${[l.image,(l.image%2===0?l.image+1:l.image-1)].map((i,n)=>`<button data-action="gallery" data-id="${i}">${photo(i,'',n?'Koleksiyon detayı':'Evde kullanım örneği')}<p class="meta">${n?'Koleksiyon köşesi':'Yeni evinde'} · Örnek paylaşım</p></button>`).join('')}${data.entities.filter(e=>e.kind==='community'&&e.listing===l.id&&visibleEntity(e)).map(e=>`<button data-action="entity" data-id="${e.id}">${photo(e.image)}<p>${esc(e.title)}</p></button>`).join('')}</div></section><div class="row between section"><span class="meta">İlan no: ${esc(l.id)} · Örnek veri</span>${btn('İlanı bildir','report',l.id,'linkbtn')}</div>`)}
function sellerProfile(name){const person=data.people.find(p=>p.name===name);if(person)openProfile(person.slug);else toast('Bu kişi için henüz vitrin oluşturulmamış.')}

function entityDetail(id){const e=data.entities.find(x=>x.id===id);if(!e||!visibleEntity(e)){toast('İçerik yayında değil.');return}showModal(kindNames[e.kind]+' · Demo',`<div class="detail-grid">${photo(e.image,'',e.title+' — temsili görsel')}<div><span class="pill">${esc(e.tag||kindNames[e.kind])}</span>${e.promoted?'<span class="pill gold">Sponsorlu</span>':''}<h1>${esc(e.title)}</h1><p class="meta">${esc(e.source||e.seller)} · ${esc(hub(e.hub).name)} ${data.people.some(p=>p.name===e.seller)?btn('Üreticinin vitrini','seller',e.seller,'linkbtn'):''}</p><p>${esc(e.desc)}</p>${e.kind==='course'?`<div class="specs"><div><small>Tarih</small><b>${esc(e.date||'24 Ekim 2026 · 14.00')}</b></div><div><small>Katılım</small><b>${esc(e.city||'Çevrimiçi')} · ${esc(e.level||'Başlangıç')}</b></div><div><small>Süre</small><b>${esc(e.duration||'2 saat')}</b></div><div><small>Ücret</small><b>${money(e.price||0)}</b></div></div><p class="meta">${e.capacity??8} kişilik örnek kontenjan · ${e.capacity===0?'Kontenjan dolu':'Başvuru organizatör onayına bağlı'}</p>${btn(e.capacity===0?'Bekleme listesi · Demo':'Katılım talebi · Demo','request',e.id,'btn primary')}`:e.kind==='service'?`<div class="specs"><div><small>Konum</small><b>${esc(e.city)}</b></div><div><small>Çalışma şekli</small><b>${esc(e.mode||'Randevuyla / yerinde')}</b></div></div><p><b>${money(e.price||650)}’den başlayan</b> örnek ücret. Kesin bedel uzman teklifiyle netleşir.</p><div class="row">${btn('Teklif iste · Demo','request',e.id,'btn primary')}${btn('Uzman vitrini','seller',e.seller)}</div>`:e.kind==='offer'?`<div class="notice">${esc(e.terms||'Örnek kampanya: seçili ürünlerde %10 indirim, 1.000 TL alt limit, tek kullanım. Diğer kampanyalarla birleşmez. 31 Ekim 2026’ya kadar.')}<br><b>Bu kupon gerçek alışverişte kullanılamaz.</b></div><div class="section">${btn('Demo kuponunu göster','coupon',e.id,'btn primary')}</div>`:e.kind==='content'?`<div class="notice">${esc(e.sourceNote||'Editoryal demo metni. Dış kaynakların tam içerikleri kopyalanmamıştır.')}</div>${e.url?`<p class="section"><a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Kaynağı yeni sekmede aç</a></p>`:''}`:`<p class="notice">Kullanıcı paylaşımı örneği · Satın alma doğrulanmamıştır.</p>${btn('Deneyimini paylaş','add-media',e.listing||'','btn primary')}`}</div></div>${e.kind==='service'?`<section class="section"><h2>Yapılan işler</h2><div class="gallery">${[e.image,(e.image+1)%8].map(i=>`<button data-action="gallery" data-id="${i}">${photo(i)}<p class="meta">Portfolyo örneği · Temsili</p></button>`).join('')}</div></section>`:''}<section class="section">${btn('İçeriği bildir','report',e.id,'linkbtn')}</section>`)}
function requestForm(id,isMessage=false){const e=data.entities.find(e=>e.id===id)||data.listings.find(l=>l.id===id);const prior=data.requests.find(r=>r.item===id);showModal(isMessage?'Satıcıya soru · Yerel demo':'Talep oluştur · Yerel demo',`<div class="content-copy"><h1>${esc(e.title)}</h1><p class="notice">Bu form yalnızca demo kaydı oluşturur. Hiç kimseye mesaj veya başvuru gönderilmez; ödeme alınmaz.</p>${prior?`<p class="pill">Bu kayıt için daha önce demo talebi oluşturdun.</p>`:''}<form class="form" data-form="request" data-id="${id}"><label>Mesajın<textarea name="message" required minlength="10" maxlength="1000" placeholder="İhtiyacını veya sormak istediğini yaz…"></textarea></label>${e.kind==='course'?'<label>Katılımcı sayısı<select name="people"><option>1</option><option>2</option></select></label>':''}<p class="meta">Gerçek kişi veya iletişim bilgisi girmene gerek yok.</p><button class="btn primary">${isMessage?'Demo sorusunu kaydet':'Demo talebini kaydet'}</button></form></div>`)}
function reportForm(id){showModal('İçerik bildir',`<h1>İncelenmesi gereken ne var?</h1><form class="form" data-form="report" data-id="${esc(id)}"><label>Bildirim nedeni<select name="reason">${options(['Yanıltıcı bilgi','Sahte / izinsiz ürün','Uygunsuz içerik','Telif veya kişisel veri','Diğer'])}</select></label><label>Açıklama<textarea name="note" required minlength="5" maxlength="600"></textarea></label><p class="notice">Bildirim demo moderasyon kuyruğuna eklenir. İçerik, karar verilene kadar yayında kalır.</p><button class="btn primary">Bildirimi demo kuyruğuna ekle</button></form>`)}
let mediaDraft=null,mediaLoadToken=0;
function mediaForm(listing=''){mediaDraft=null;mediaLoadToken++;showModal('Kullananlardan · Deneyim ekle',`<h1>Hobinin hayatındaki yerini göster.</h1><p class="muted">Bilgisayarından bir fotoğraf seç. Bu demoda fotoğraf küçültülerek yalnız bu tarayıcıya kaydedilir; sunucuya gönderilmez.</p><form class="form" data-form="media" data-id="${esc(listing)}"><label>Başlık<input name="title" required minlength="4" maxlength="100" placeholder="Benim bitki köşem"></label><label>Deneyimin<textarea name="desc" required minlength="10" maxlength="800"></textarea></label><label>Fotoğraf ekle<input id="experience-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp" required aria-describedby="photo-help"></label><p id="photo-help" class="meta">JPEG, PNG veya WebP · En fazla 10 MB · Fotoğraf en fazla 1200 piksele küçültülür. HEIC için önce JPEG olarak dışa aktar.</p><div id="photo-preview" aria-live="polite"></div><p class="form-error" role="alert"></p><label class="row"><input type="checkbox" required name="rights"> Fotoğrafı paylaşma hakkım var; izinsiz kişisel bilgi içermiyor.</label><p class="meta">“Demoyu indir” fotoğrafı da HTML dosyasına dahil eder. Dosyayı gönderdiğin kişiler fotoğrafı görebilir.</p><button id="media-submit" class="btn primary" disabled>Moderasyona gönder · Demo</button></form>`)}
document.addEventListener('change',async e=>{if(e.target.id!=='experience-photo')return;const token=++mediaLoadToken;mediaDraft=null;const f=e.target.files?.[0],preview=$('#photo-preview'),submit=$('#media-submit');submit.disabled=true;preview.textContent='';if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>10*1024*1024){preview.textContent='JPEG, PNG veya WebP biçiminde, 10 MB altında bir fotoğraf seç.';e.target.value='';return}preview.textContent='Fotoğraf hazırlanıyor…';try{const encoded=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error());r.readAsDataURL(f)});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=encoded});if(token!==mediaLoadToken)return;if(!img.width||!img.height||img.width*img.height>50000000)throw Error();const scale=Math.min(1,1200/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const image=canvas.toDataURL('image/jpeg',0.78);if(image.length>2000000)throw Error();mediaDraft=image;preview.innerHTML=`<img src="${image}" alt="Seçtiğin fotoğrafın önizlemesi" style="max-width:100%;max-height:280px;border-radius:12px;object-fit:contain"><p class="meta">${esc(f.name)} · Hazır. Değiştirmek için başka fotoğraf seç.</p>`;submit.disabled=false;}catch(err){if(token!==mediaLoadToken)return;preview.textContent='Fotoğraf okunamadı veya çok büyük. Daha küçük bir JPEG/PNG fotoğraf dene.';mediaDraft=null;}});

function attributeFields(h,cat){return h.attributes.filter(a=>!a.category||descendants(a.category,h).has(cat)).map(a=>`<label>${esc(a.name)} ${a.unit?'('+esc(a.unit)+')':''}${a.required?' *':''}${['select','boolean','multi'].includes(a.type)?`<select name="attr_${a.id}" ${a.required?'required':''} ${a.type==='multi'?'multiple':''}><option value="">Seç</option>${options(a.type==='boolean'?['Evet','Hayır']:a.options)}</select>`:`<input name="attr_${a.id}" type="${a.type==='number'?'number':'text'}" ${a.type==='number'?'min="0" step="any"':''} ${a.required?'required':''} maxlength="120">`}</label>`).join('')}
function listingForm(hid=state.hub){const h=hub(hid);showModal('Yeni ilan · Yerel demo',`<h1>Hobinden bir parça paylaş.</h1><form class="form" data-form="listing"><div class="grid2"><label>Hobi<select name="hub" id="listing-hub">${options(data.hubs.filter(h=>h.active),hid)}</select></label><label>Kategori<select name="cat" id="listing-cat" required><option value="">Kategori seç</option>${options(allNodes(h).map(c=>({id:c.id,name:path(c.id,h)})))}</select></label></div><label>İlan başlığı<input name="title" required minlength="5" maxlength="100" placeholder="Örn. Köklü Monstera albo çeliği"></label><div class="grid2"><label>Fiyat · TL<input name="price" type="number" min="1" max="10000000" required></label><label>İlan türü<select name="type">${options(h.listingTypes)}</select></label><label>Konum<select name="city">${options(['İstanbul','Ankara','İzmir','Bursa'])}</select></label><label>Teslimat<select name="delivery">${options(['Elden teslim','Kargo','Kargo veya elden'])}</select></label></div><div class="grid2" id="dynamic-attributes">${attributeFields(h,'')}</div><label>Açıklama<textarea name="desc" required minlength="20" maxlength="1500" placeholder="Ürünün durumunu ve önemli ayrıntıları belirt."></textarea></label><p class="notice">Hazır temsili görsel atanır. İlan, backoffice’te onaylanana kadar görünmez.</p><button class="btn primary">İncelemeye gönder · Demo</button></form>`)}
function help(){showModal('Demo rehberi',`<h1>Hobby Hub’ı 5 dakikada dene.</h1><ol class="stack"><li><b>Bir hobi seç.</b> Önce bir rehberi, uzmanı veya etkinliği keşfet. Topluluk paylaşımlarına göz at.</li><li><b>İlan arıyorsan “İlanlar”a geç.</b> Soldan kategoriye in; fiyat, tür ve hobiye özel filtreleri uygula.</li><li><b>Aramayı dene.</b> “Monstera”, “saat” veya “kurulum” yaz. Üstteki kapsamı değiştirerek bütün hobilerde ara.</li><li><b>Bir ilanı aç.</b> Satıcı vitrini, kullananlardan galerisi, kaydetme ve yerel soru formunu dene.</li><li><b>Uzmanlar ve etkinliklere bak.</b> Teklif veya katılım talebi oluştur; fırsat kuponunu göster.</li><li><b>Backoffice’e geç.</b> Yeni hobi, kategori veya özellik ekle. Bölümleri sırala; “Yayınla · Demo” ile ziyaretçi görünümüne taşı.</li><li><b>Moderasyonu test et.</b> “Paylaş → İlan oluştur” veya “Deneyimini paylaş” ile kayıt oluştur; moderasyondan onayla.</li></ol><p class="notice">Bütün veriler örnektir. Gerçek hesap, ödeme, kargo, mesaj iletimi veya güvenli yönetici erişimi yoktur. Yerel kayıt ${storageOK?'açık':'kullanılamıyor'}.</p><div class="row section">${btn('Yapılandırılmış demoyu indir','export','','btn primary')}${btn('Backoffice’i aç','admin')}</div><p class="terms section">İndirilen HTML mevcut demo verilerini içerir. Arkadaşların dosyayı bilgisayara indirip Chrome, Safari veya Edge’de açabilir. E-posta önizlemesinde etkileşimler çalışmayabilir. Her tarayıcının verisi ayrıdır; ortak veritabanı yoktur.</p>`)}
function adminView(){const menu={overview:'Genel bakış',hubs:'Hobiler',tree:'Kategori ağacı',schema:'Özellikler & filtreler',sections:'Bölümler & sıralama',content:'İçerik & öne çıkarma',moderation:'Moderasyon',log:'İşlem geçmişi',users:'Kullanıcılar & yetkiler'};const h=hub(state.adminHub,true)||data.draftHubs[0];state.adminHub=h.id;return `<div class="shell admin-shell"><aside class="admin-side"><h2>Yönetim alanı</h2>${Object.entries(menu).map(([id,n])=>btn(n,'admin-tab',id,'btn '+(state.adminTab===id?'active':''))).join('')}<div class="notice section">Rol kontrollü yerel demo.<br>Gerçek güvenlik sunucuda uygulanmalıdır.</div></aside><main id="main" class="admin-main"><div class="adminbar"><div><div class="eyebrow muted">Hobby Hub / Backoffice</div><h1 style="margin:8px 0 0">${menu[state.adminTab]||menu.overview}</h1><p class="muted">Yayın revizyonu ${data.revision} · Yapılandırma değişiklikleri taslakta tutulur.</p></div><div class="row">${btn('Ziyaretçi görünümü','exit-admin','','btn')}${btn('Yayınla · Demo','publish','','btn primary')}</div></div>${!storageOK?'<p class="notice">Tarayıcı kaydı kullanılamıyor. İndirerek sakla.</p>':''}${!['overview','log','moderation','users'].includes(state.adminTab)?`<div class="row between" style="margin-bottom:22px"><label>Hobi seç<select class="admin-select" id="admin-hub">${options(data.draftHubs,h.id)}</select></label><span class="pill">Taslak yapılandırma</span></div>`:''}${adminContent(h)}</main></div>`}
function adminContent(h){switch(state.adminTab){case 'overview':return `<div class="grid3"><div class="metric"><strong>${data.hubs.filter(h=>h.active).length}</strong><span>Yayındaki hobi</span></div><div class="metric"><strong>${data.listings.filter(visibleListing).length}</strong><span>Yayındaki örnek ilan</span></div><div class="metric"><strong>${data.listings.filter(l=>l.status==='pending').length+data.entities.filter(e=>e.status==='pending').length+data.reports.filter(r=>r.status==='pending').length}</strong><span>Moderasyonda bekleyen</span></div></div><div class="grid2 section"><section class="panel"><h2>Bir hobi nasıl açılır?</h2><ol class="stack"><li>Hobi adı ve giriş metnini tanımla.</li><li>Kategori ağacı ve ilan türlerini oluştur.</li><li>Özellikleri, filtreleri ve görünür bölümleri seç.</li><li>Yayınla; ardından örnek ilan ve içerik ekle.</li></ol>${btn('Hobi oluştur','new-hub','','btn primary')}</section><section class="panel"><h2>Demo çalışma alanı</h2><p>Şema, bölüm ve kategori taslaklarını yayınlayınca ziyaretçi ekranları değişir. İçerik ve moderasyon işlemleri kaydedildiğinde yerel demoya hemen yansır.</p><div class="stack">${btn('Mevcut demoyu HTML olarak indir','export')}${btn('Önceki yapılandırmaya dön','rollback')}${btn('Başlangıç verisine dön…','reset','','btn danger')}</div></section></div><section class="panel section"><h2>Yerel talepler</h2>${data.requests.length?`<div class="tablewrap"><table class="admin-table"><thead><tr><th>Kayıt</th><th>Mesaj</th><th>Durum</th></tr></thead><tbody>${data.requests.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.message)}</td><td>Demo alındı · İletilmedi</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Henüz demo soru, teklif veya katılım talebi yok.</p>'}</section>`;
case 'hubs':return `<div class="row between"><p class="muted">Yeni hobi, mevcut ekran şablonlarıyla çalışır.</p>${btn('+ Yeni hobi','new-hub','','btn primary')}</div><section class="panel"><form class="form" data-form="hub" data-id="${h.id}"><div class="grid2"><label>Hobi adı<input name="name" value="${esc(h.name)}" maxlength="40" required></label><label>Kısa simge<input name="symbol" value="${esc(h.symbol)}" maxlength="4" required></label></div><label>Üst etiket<input name="kicker" value="${esc(h.kicker)}" maxlength="60" required></label><label>Hub başlığı<input name="headline" value="${esc(h.headline)}" maxlength="80" required></label><label>Açıklama<input name="subtitle" value="${esc(h.subtitle)}" maxlength="160" required></label><label>İlan türleri · virgülle ayır<input name="listingTypes" value="${esc(h.listingTypes.join(', '))}" required maxlength="250"></label><label class="row"><input type="checkbox" name="active" ${h.active?'checked':''}> Ziyaretçi menüsünde aktif</label><div class="form-footer"><button class="btn primary">Taslağı kaydet</button></div></form></section>`;
case 'tree':return `<div class="row between"><p class="muted">Üst kategori seçerek taşı. Alt dallar ve ilan bağları korunur.</p>${btn('+ Kategori ekle','new-category','','btn primary')}</div><section class="panel">${h.categories.length?adminTree(h):'<p>Henüz kategori yok.</p>'}</section><p class="meta section">Döngü oluşturan taşıma engellenir. Kategori silme ve birleştirme bu demoda yoktur.</p>`;
case 'schema':return `<div class="row between"><p class="muted">Özellik şeması ilan formunu; filtre ayarı sol paneli üretir.</p>${btn('+ Özellik ekle','new-attribute','','btn primary')}</div><section class="panel tablewrap"><table class="admin-table"><thead><tr><th>Özellik</th><th>Tür / kapsam</th><th>Zorunlu</th><th>Filtre</th><th></th></tr></thead><tbody>${h.attributes.map(a=>`<tr><td><b>${esc(a.name)}</b><br><small>${esc(a.options.join(', ')||a.unit||'Serbest değer')}</small></td><td>${esc(a.type)}<br><small>${a.category?esc(path(a.category,h)):'Tüm kategoriler'}</small></td><td>${a.required?'Evet':'Hayır'}</td><td>${a.filterable?'Açık':'Kapalı'}</td><td>${btn('Düzenle','edit-attribute',a.id,'btn small')}</td></tr>`).join('')}</tbody></table></section><p class="notice section">Demo veri kaybını önlemek için mevcut özelliğin tipi değiştirilmez. Üretimde tip değişikliği yeni şema sürümü ve veri göçü gerektirir.</p>`;
case 'sections':return `<section class="panel"><h2>Hub’ın bölüm düzeni</h2><p class="muted">Üst seçki, açık bölümlerden bir rehber, uzman ve etkinlik gösterir. Aşağıdaki sıra menüleri ve seçki altındaki bölümleri düzenler. Kapalı bölümler tüm ziyaretçi yüzeylerinden çıkar.</p>${h.sections.map((s,i)=>`<div class="order-row"><label class="row"><input type="checkbox" data-section="${s.id}" ${s.enabled?'checked':''}> ${tabNames[s.id]}</label><button class="btn small" data-action="section-up" data-id="${s.id}" ${i===0?'disabled':''} aria-label="${tabNames[s.id]} yukarı taşı">↑</button><button class="btn small" data-action="section-down" data-id="${s.id}" ${i===h.sections.length-1?'disabled':''} aria-label="${tabNames[s.id]} aşağı taşı">↓</button></div>`).join('')}</section>`;
case 'content':{const es=data.entities.filter(e=>e.hub===h.id),ls=data.listings.filter(l=>l.hub===h.id);return `<div class="row between"><p class="muted">Bu alandaki kayıtlar ve öne çıkarma yerel demoya hemen yansır.</p>${btn('+ İçerik / hizmet ekle','new-entity','','btn primary')}</div><section class="panel tablewrap"><table class="admin-table"><thead><tr><th>Kayıt</th><th>Tür</th><th>Durum</th><th>Öne çıkar</th><th></th></tr></thead><tbody>${[...es,...ls].map(e=>`<tr><td>${esc(e.title)}</td><td>${kindNames[e.kind]||'İlan'}</td><td>${statusNames[e.status]}</td><td><input type="checkbox" data-promote="${e.id}" aria-label="${esc(e.title)} sponsorlu göster" ${e.promoted?'checked':''}></td><td>${e.kind?btn('Düzenle','edit-entity',e.id,'btn small'):''}</td></tr>`).join('')}</tbody></table></section><p class="meta section">Öne çıkarılan kayıtlar “Sponsorlu” etiketi taşır. Ödeme, zamanlama ve kampanya bütçesi bu prototipte yoktur.</p>`}
case 'moderation':{const pending=[...data.listings,...data.entities].filter(e=>e.status==='pending'),reports=data.reports.filter(r=>r.status==='pending');return `<p class="notice">Onaylanan örnek kayıt ziyaretçi ekranına eklenir. Ret ve gizleme için karar gerekçesi istenir.</p><section class="panel section"><h2>Yeni kayıtlar <small>(${pending.length})</small></h2>${pending.length?pending.map(e=>`<div class="mini" style="margin-bottom:12px">${photo(e.image)}<div class="inside"><h3>${esc(e.title)}</h3><p class="meta">${esc(hub(e.hub)?.name||'Taslak hobi')} · ${kindNames[e.kind]||'İlan'}</p><p style="font-size:14px">${esc(e.desc)}</p></div><div class="stack">${btn('İncele & karar ver','moderate',e.id,'btn small')}</div></div>`).join(''):'<p class="muted">Yeni kayıt kuyruğu boş.</p>'}</section><section class="panel section"><h2>Bildirilen içerikler <small>(${reports.length})</small></h2>${reports.length?reports.map(r=>`<div class="mini" style="margin-bottom:12px"><div class="inside"><h3>${esc([...data.listings,...data.entities].find(e=>e.id===r.item)?.title||r.item)}</h3><p>${esc(r.reason)}</p><p class="meta">${esc(r.note)}</p></div>${btn('Bildirimi incele','moderate-report',r.id,'btn small')}</div>`).join(''):'<p class="muted">Bekleyen bildirim yok.</p>'}</section><section class="panel section"><h2>Son kararlar</h2>${data.decisions.length?data.decisions.slice(0,8).map(d=>`<p><b>${esc(d.title)}</b> · ${esc(d.result)}<br><small>${esc(d.reason)} · ${esc(d.at)}</small></p>`).join(''):'<p class="muted">Henüz karar verilmedi.</p>'}</section>`}
case 'log':return `<section class="panel"><h2>Bu tarayıcıdaki işlem geçmişi</h2><p class="meta">Demo günlüğüdür; değiştirilemez üretim denetim kaydı değildir.</p>${data.audit.length?data.audit.map(a=>`<p><small>${esc(a.at)}</small><br>${esc(a.action)}</p>`).join(''):'Henüz işlem yok.'}</section>`;default:return ''}}
function adminTree(h,parent=''){return h.categories.filter(c=>c.parent===parent).map(c=>`<div class="admin-tree"><div class="row"><span>${esc(c.name)}</span>${btn('Düzenle / taşı','edit-category',c.id,'btn small')}</div>${adminTree(h,c.id)}</div>`).join('')}
function newHub(){showModal('Yeni hobi',`<h1>Yeni bir merak alanı aç.</h1><form class="form" data-form="new-hub"><label>Hobi adı<input name="name" required minlength="2" maxlength="40" placeholder="Örn. Parfüm"></label><label>Başlık<input name="headline" required maxlength="80" placeholder="Yeni kokular, yeni hikâyeler."></label><p class="notice">Taslak hobiye bir başlangıç kategorisi ve ortak ilan türleri eklenir. Ardından özelliklerini tanımlayabilirsin.</p><button class="btn primary">Taslak hobi oluştur</button></form>`)}
function categoryForm(id=''){const h=hub(state.adminHub,true),c=h.categories.find(c=>c.id===id)||{name:'',parent:''};const excluded=id?descendants(id,h):new Set;showModal(id?'Kategori düzenle':'Kategori ekle',`<form class="form" data-form="category" data-id="${id}"><label>Kategori adı<input name="name" value="${esc(c.name)}" required minlength="2" maxlength="60"></label><label>Üst kategori<select name="parent"><option value="">Ana kategori</option>${options(h.categories.filter(n=>!excluded.has(n.id)).map(n=>({id:n.id,name:path(n.id,h)})),c.parent)}</select></label><p class="meta">Mevcut ilanların kategori kimliği değişmez.</p><button class="btn primary">Kategori taslağını kaydet</button></form>`)}
function attributeForm(id=''){const h=hub(state.adminHub,true),a=h.attributes.find(a=>a.id===id)||{name:'',type:'select',options:[],unit:'',filterable:true,required:false,category:''};showModal(id?'Özellik düzenle':'Özellik ekle',`<form class="form" data-form="attribute" data-id="${id}"><div class="grid2"><label>Özellik adı<input name="name" value="${esc(a.name)}" required maxlength="40"></label><label>Veri tipi<select name="type" ${id?'disabled':''}>${options([{id:'select',name:'Seçim listesi'},{id:'multi',name:'Çoklu seçim'},{id:'number',name:'Sayı'},{id:'boolean',name:'Evet / Hayır'},{id:'text',name:'Metin'}],a.type)}</select></label></div><label>Kategori kapsamı<select name="category"><option value="">Tüm kategoriler</option>${options(h.categories.map(c=>({id:c.id,name:path(c.id,h)})),a.category)}</select></label><label>Seçenekler · virgülle ayır<input name="options" value="${esc(a.options.join(', '))}" maxlength="350" placeholder="Düşük, Orta, Yüksek"></label><label>Birim · sayısal alanlar için<input name="unit" value="${esc(a.unit)}" maxlength="12" placeholder="mm, L, cm"></label><label class="row"><input name="required" type="checkbox" ${a.required?'checked':''}> Yeni ilanlarda zorunlu</label><label class="row"><input name="filterable" type="checkbox" ${a.filterable?'checked':''}> Sol panelde filtre olarak göster</label><p class="meta">Metin özellikleri serbest giriş içindir ve filtreye açılmaz. Sayı filtresi demoda mevcut değerler üzerinden seçilir.</p><p class="form-error" role="alert"></p><button class="btn primary">Özellik taslağını kaydet</button></form>`)}
function entityForm(id=''){const e=data.entities.find(e=>e.id===id)||{kind:'content',title:'',desc:'',source:'',seller:'',city:'İstanbul',url:'',status:'pending',price:0,date:'24 Ekim 2026 · 14.00',capacity:8,tag:'',terms:''};showModal(id?'İçerik düzenle':'İçerik / hizmet ekle',`<form class="form" data-form="entity" data-id="${id}"><div class="grid2"><label>İçerik türü<select name="kind">${options(Object.entries(kindNames).map(([id,name])=>({id,name})),e.kind)}</select></label><label>Durum<select name="status">${options(Object.entries(statusNames).map(([id,name])=>({id,name})),e.status)}</select></label></div><label>Başlık<input name="title" value="${esc(e.title)}" required minlength="5" maxlength="100"></label><label>Açıklama<textarea name="desc" required minlength="15" maxlength="1500">${esc(e.desc)}</textarea></label><div class="grid2"><label>Kaynak / yayıncı<input name="source" value="${esc(e.source)}" required maxlength="70"></label><label>Sağlayıcı / satıcı<input name="seller" value="${esc(e.seller)}" required maxlength="60"></label><label>Konum<input name="city" value="${esc(e.city)}" required maxlength="50"></label><label>Kart etiketi<input name="tag" value="${esc(e.tag)}" maxlength="30"></label></div><label>Kaynak adresi · isteğe bağlı<input name="url" type="url" value="${esc(e.url)}" placeholder="https://…"></label><div class="grid2"><label>Hizmet / etkinlik ücreti · TL<input name="price" type="number" min="0" max="10000000" value="${e.price||0}"></label><label>Etkinlik kontenjanı<input name="capacity" type="number" min="0" max="10000" value="${e.capacity??8}"></label></div><label>Etkinlik tarihi<input name="date" value="${esc(e.date||'24 Ekim 2026 · 14.00')}" maxlength="80"></label><label>Fırsat koşulları<textarea name="terms" maxlength="500">${esc(e.terms||'')}</textarea></label><p class="notice">Kayıt seçili hobiye eklenir. “Yayında” kaydetmek yerel ziyaretçi görünümünü hemen değiştirir. İnternet kaynağından otomatik içerik çekilmez.</p><p class="form-error" role="alert"></p><button class="btn primary">İçeriği kaydet · Demo</button></form>`)}
function moderationForm(id,isReport=false){const report=isReport?data.reports.find(r=>r.id===id):null;const e=[...data.listings,...data.entities].find(e=>e.id===(report?report.item:id));showModal('Moderasyon kararı',`<h1>${esc(e?.title||'Kayıt')}</h1><p>${esc(e?.desc||'')}</p>${e?photo(e.image,'','İncelenen temsili görsel'):''}<form class="form section" data-form="moderation" data-id="${id}" data-report="${isReport}"><label>Karar<select name="decision">${options(isReport?[{id:'dismiss',name:'Bildirimi kapat · içerik yayında kalsın'},{id:'hide',name:'İçeriği gizle'}]:[{id:'approve',name:'Onayla ve yayınla'},{id:'reject',name:'Reddet'}])}</select></label><label>Karar gerekçesi<textarea name="reason" required minlength="5" maxlength="500"></textarea></label><button class="btn primary">Kararı uygula · Demo</button></form>`)}
function publish(){const hs=data.draftHubs;if(!hs.some(h=>h.active)){toast('En az bir hobi aktif olmalı.');return}for(const h of hs){if(!h.categories.length||!h.listingTypes.length){toast(h.name+': kategori ve ilan türü gerekli.');return}if(h.categories.some(c=>c.parent&&!node(c.parent,h))){toast('Geçersiz üst kategori var.');return}if(!h.sections.some(s=>s.enabled)){toast(h.name+': en az bir bölüm açık olmalı.');return}}data.previousHubs=copy(data.hubs);data.hubs=copy(hs);data.revision++;audit('Hobi yapılandırması yayınlandı · revizyon '+data.revision);state.filters={};state.cat='';render();toast('Taslak yapılandırma ziyaretçi görünümüne yansıdı. · Revizyon '+data.revision)}

function profileHero(p,preview=false){const ls=personListings(p);return `<section class="profile-hero theme-${p.theme}"><div class="profile-cover">${photo(p.image,'',p.name+' vitrin kapağı — temsili')}<div class="profile-cover-label">BAĞIMSIZ BİR HOBİ VİTRİNİ</div></div><div class="profile-identity">${avatarMarkup(p,'creator-avatar theme-'+p.theme)}<div class="profile-title"><div class="row between"><div><span class="eyebrow">${esc(p.city)} · ÜRETİCİ / KOLEKSİYONER</span><h1>${esc(p.name)}</h1></div>${!preview?btn(data.following.includes(p.name)?'✓ Takip ediliyor':'＋ Takip et','creator-follow',p.id,'btn'):''}</div><p>${esc(p.tagline)}</p><div class="creator-tags">${p.specialties.map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="row profile-ctas">${!preview?profileLink(p,'Tüm ilanlarım · '+ls.length,'listings','btn primary'):''}${!preview?btn('Vitrini paylaş','share-profile',p.slug):''}${safeShopier(p.shopier)?`<a class="btn" href="${esc(p.shopier)}" target="_blank" rel="noopener noreferrer">Shopier mağazası ↗</a>`:''}</div>${p.shopier?'<p class="meta">Shopier ayrı bir satış kanalıdır. Stok ve sipariş eşitlemesi yoktur.</p>':''}</div></div></section>`}
function profileView(h){const p=personBySlug(state.profile);if(!p)return '<div class="empty">Vitrin bulunamadı.</div>';const tabs=profileTabs(p);if(!tabs.includes(state.profileTab))state.profileTab='showcase';const own=p.id===data.me,ls=personListings(p),featured=p.featured.map(id=>ls.find(l=>l.id===id)).filter(Boolean);let body='';switch(state.profileTab){case'listings':body=`<div class="section-head"><div><h2>${esc(p.name)} · İlanlar</h2><p>Yalnızca bu üreticiye ait ${ls.length} yayındaki ilan.</p></div></div>${ls.length?`<div class="cards all">${ls.map(card).join('')}</div>`:'<div class="empty">Bu vitrinde şu anda yayında ilan yok.</div>'}`;break;case'collection':body=`<h2>Koleksiyonum & üretimim</h2><p class="muted">Bu albümdeki her parça satılık olmak zorunda değil.</p>${galleryMarkup(p)}`;break;case'notes':body=`<h2>Deneyimlerimden notlar</h2>${notesMarkup(p)}`;break;case'about':body=`<section class="panel content-copy"><h2>Benim hikâyem</h2><p class="profile-bio">${esc(p.bio)}</p><h3>İlgilendiğim alanlar</h3><p>${esc(p.specialties.join(' · '))}</p><p class="meta">Bu profil demo örneğidir; uzmanlık veya satın alma doğrulaması yapılmamıştır.</p></section>`;break;case'services':case'events':body=`<h2>${state.profileTab==='services'?'Sunduğum hizmetler':'Birlikte öğrenelim'}</h2><div class="grid3">${personEntities(p,state.profileTab==='services'?'service':'course').map(entityCard).join('')}</div>`;break;default:body=`<div class="profile-welcome section"><div><span class="eyebrow">VİTRİNİME HOŞ GELDİN</span><h2>Merakımı burada biriktiriyorum.</h2><p>${esc(p.bio)}</p></div><aside><b>Yeni paylaşımları kaçırma.</b><p>Üretim, koleksiyon ve notlar aynı yerde.</p>${btn(data.following.includes(p.name)?'Takip ediliyor':'Takip et','creator-follow',p.id,'btn')}<small>Demo takibi bu cihazda saklanır; bildirim gönderilmez.</small></aside></div><section class="section"><div class="section-head"><h2>Vitrinimden seçtiklerim</h2>${profileLink(p,'Tüm ilanlar · '+ls.length,'listings','linkbtn')}</div>${featured.length?`<div class="cards all">${featured.map(card).join('')}</div>`:'<p class="muted">Henüz öne çıkarılan ilan yok. Tüm ilanlar sekmesinden mevcut kayıtları görebilirsin.</p>'}</section>${p.showGallery?`<section class="section"><div class="section-head"><h2>Koleksiyon & üretim</h2>${profileLink(p,'Albümü aç','collection','linkbtn')}</div>${galleryMarkup(p)}</section>`:''}${p.showNotes?`<section class="section"><div class="section-head"><h2>Bakım ve deneyim notlarım</h2>${profileLink(p,'Tüm notlar','notes','linkbtn')}</div>${notesMarkup(p)}</section>`:''}`;}

function safeShopier(url){if(!url)return false;try{const u=new URL(url);return u.protocol==='https:'&&!u.username&&!u.password&&(u.hostname==='shopier.com'||u.hostname.endsWith('.shopier.com'))}catch(e){return false}}
function manageProfile(){showModal('Vitrin yönetimi · Demo hesabı',`<h1>Kendi vitrininle başla.</h1><p class="notice">Bu seçim yalnızca demo kişisini değiştirir. Gerçek giriş veya yetkilendirme değildir. Başkalarının gerçek hesaplarına erişim sağlamaz.</p><form class="form" data-form="choose-profile"><label>Denemek istediğin kişi<select name="person">${options(data.people.map(p=>({id:p.id,name:p.name+' · '+p.city})),data.me)}</select></label><button class="btn primary">Bu kişinin vitriniyle devam et</button></form>`)}
function imageOptions(current){return options([{id:'0',name:'Monstera'},{id:'1',name:'Anthurium'},{id:'2',name:'Akvaryum'},{id:'3',name:'Karides'},{id:'4',name:'Saat'},{id:'5',name:'Vintage saat'},{id:'6',name:'3D yazıcı'},{id:'7',name:'Üretim saksıları'}],String(current))}
function editProfile(id){const p=data.people.find(p=>p.id===id);if(!p||p.id!==data.me)return toast('Önce demo hesabını bu kişi olarak seç.');profileDraft=null;const notes=personEntities(p,'content');showModal('Vitrinimi düzenle',`<h1>${esc(p.name)}</h1><p class="muted">Sayfa tasarlamadan kendi hikâyeni, seçkini ve notlarını düzenle.</p><form class="form" data-form="profile-edit" data-id="${p.id}"><div class="grid2"><label>Görünen ad<input name="name" required maxlength="60" value="${esc(p.name)}"></label><label>Şehir<input name="city" required maxlength="50" value="${esc(p.city)}"></label></div><label>Kısa tanıtım<input name="tagline" required maxlength="180" value="${esc(p.tagline)}"></label><label>Hikâyen<textarea name="bio" required minlength="20" maxlength="2000">${esc(p.bio)}</textarea></label><label>Uzmanlık / ilgi alanları · virgülle ayır<input name="specialties" required maxlength="180" value="${esc(p.specialties.join(', '))}"></label><div class="grid2"><label>Kapak görseli<select name="image">${imageOptions(p.image)}</select></label><label>Vitrin rengi<select name="theme">${options([{id:'forest',name:'Orman yeşili'},{id:'ocean',name:'Gece mavisi'},{id:'plum',name:'Mürdüm'}],p.theme)}</select></label></div><label>Shopier mağaza adresi · isteğe bağlı<input type="url" name="shopier" value="${esc(p.shopier)}" placeholder="https://www.shopier.com/…"></label><p class="meta">Gerçek adres girmek zorunda değilsin. Bağlantı eklenirse ziyaretçi dış mağazaya gider; ürün veya stok otomatik aktarılmaz.</p><fieldset><legend>Öne çıkaracağın ilanlar</legend>${personListings(p).map(l=>`<label class="check-row"><input type="checkbox" name="featured" value="${l.id}" ${p.featured.includes(l.id)?'checked':''}> ${esc(l.title)}</label>`).join('')||'<p>Henüz ilan yok.</p>'}</fieldset><fieldset><legend>Koleksiyon & üretim albümü</legend><label class="check-row"><input name="showGallery" type="checkbox" ${p.showGallery?'checked':''}> Albümü ziyaretçilere göster</label>${p.gallery.map((g,i)=>`<div class="panel stack"><label>Görsel ${i+1}<select name="galleryImage${i}">${imageOptions(g.image)}</select></label><label>Başlık<input name="galleryTitle${i}" value="${esc(g.title)}" required maxlength="80"></label><label>Açıklama<input name="galleryCaption${i}" value="${esc(g.caption)}" maxlength="200"></label></div>`).join('')}</fieldset><fieldset><legend>Bakım & deneyim notları</legend><label class="check-row"><input name="showNotes" type="checkbox" ${p.showNotes?'checked':''}> Notlar sekmesini göster</label>${notes.map(n=>`<div class="panel stack"><label>Not başlığı<input name="noteTitle_${n.id}" value="${esc(n.title)}" required maxlength="100"></label><label>Not metni<textarea name="noteText_${n.id}" required minlength="15" maxlength="1500">${esc(n.desc)}</textarea></label></div>`).join('')}<label>Yeni not başlığı · isteğe bağlı<input name="newNoteTitle" maxlength="100"></label><label>Yeni not metni<textarea name="newNoteText" maxlength="1500"></textarea></label></fieldset><p class="form-error" role="alert"></p><button class="btn primary">Değişiklikleri önizle</button></form>`)}
function shareProfile(slug){const p=personBySlug(slug),hash=profileURL(p),address=location.href.split('#')[0]+hash;showModal('Vitrini paylaş',`<h1>${esc(p.name)} vitrinini paylaş.</h1><label>Bu bilgisayardaki doğrudan adres<input readonly value="${esc(address)}" aria-label="Vitrin adresi"></label><p class="notice">Bu demo yerel HTML dosyasıdır. Bilgisayarındaki dosya adresi arkadaşının cihazında açılmaz. “Demoyu indir” ile dosyayı gönder; aşağıdaki vitrin bağlantısı dosyanın içinde çalışır.</p><p>${profileLink(p,'Bu vitrini aç','showcase','btn')}</p>${btn('Mevcut demoyu indir','export','','btn primary')}<p class="meta section">Gerçek yayında bu vitrin kalıcı bir web adresine sahip olacak. Bu çalışmada canlı site yayımlanmadı.</p>`)}
document.addEventListener('click',event=>{if(authGuard(event,'click'))return;const b=event.target.closest('[data-action]');if(!b)return;const {action,id}=b.dataset;if(action==='profile')openProfile(id);if(action==='manage-profile')manageProfile();if(action==='edit-profile')editProfile(id);if(action==='share-profile')shareProfile(id);if(action==='clear-creators'){creatorQuery='';creatorCity='';render()}if(action==='creator-follow'){const p=data.people.find(p=>p.id===id);data.following=data.following.includes(p.name)?data.following.filter(n=>n!==p.name):[...data.following,p.name];save();render();toast(data.following.includes(p.name)?'Takip listene eklendi. Demo bildirimi gönderilmez.':'Takipten çıkarıldı.')}if(action==='publish-profile'&&profileDraft){const {person,notes,newNote}=profileDraft,old=data.people.find(p=>p.id===person.id);if(old.id!==data.me)return toast('Demo hesabı değişti; yeniden düzenle.');const oldName=old.name;if(oldName!==person.name){for(const l of data.listings)if(l.seller===oldName)l.seller=person.name;for(const e of data.entities)if(e.seller===oldName){e.seller=person.name;if(e.source===oldName)e.source=person.name}data.following=data.following.map(n=>n===oldName?person.name:n)}Object.assign(old,person);for(const n of notes){const e=data.entities.find(e=>e.id===n.id);Object.assign(e,{title:n.title,desc:n.desc,summary:n.desc.slice(0,105)})}if(newNote)data.entities.push({...newNote,id:uid(),hub:old.hubs[0],kind:'content',image:old.image,seller:old.name,source:old.name,city:old.city,status:'published',promoted:false,tag:'Üreticiden notlar'});profileDraft=null;audit('Kişisel vitrin güncellendi: '+old.name);openProfile(old.slug);toast('Vitrin bu tarayıcıda güncellendi.')}if(action==='cancel-profile-preview'&&profileDraft){const id=profileDraft.person.id;editProfile(id)}});
document.addEventListener('submit',event=>{if(authGuard(event,'submit'))return;const f=event.target,kind=f.dataset.form;if(f.id!=='creator-search'&&!['choose-profile','profile-edit'].includes(kind))return;event.preventDefault();const fd=new FormData(f),v=Object.fromEntries(fd.entries());if(f.id==='creator-search'){creatorQuery=v.q.trim();creatorCity=v.city;render();return}if(kind==='choose-profile'){if(!data.people.some(p=>p.id===v.person))return;data.me=v.person;save();const p=data.people.find(p=>p.id===data.me);openProfile(p.slug);return}const p=data.people.find(p=>p.id===f.dataset.id);if(!p||p.id!==data.me)return;const fail=msg=>f.querySelector('.form-error').textContent=msg;const name=v.name.trim(),specialties=v.specialties.split(',').map(x=>x.trim()).filter(Boolean);if(!name||!v.city.trim()||!v.tagline.trim()||v.bio.trim().length<20||!specialties.length)return fail('Ad, şehir, tanıtım, hikâye ve en az bir ilgi alanı gerekli.');if(data.people.some(x=>x.id!==p.id&&fold(x.name)===fold(name)))return fail('Bu görünen ad başka bir demo vitrini tarafından kullanılıyor.');if(v.shopier&&!safeShopier(v.shopier))return fail('HTTPS ile başlayan geçerli bir shopier.com mağaza adresi kullan.');if(Boolean(v.newNoteTitle.trim())!==Boolean(v.newNoteText.trim()))return fail('Yeni not için hem başlık hem metin gir.');if(v.newNoteText&&v.newNoteText.trim().length<15)return fail('Yeni not metni en az 15 karakter olmalı.');const ownIds=new Set(personListings(p).map(l=>l.id));const person={...copy(p),name,city:v.city.trim(),tagline:v.tagline.trim(),bio:v.bio.trim(),specialties:specialties.slice(0,6),image:Math.max(0,Math.min(7,Number(v.image)||0)),theme:['forest','ocean','plum'].includes(v.theme)?v.theme:'forest',shopier:v.shopier.trim(),featured:fd.getAll('featured').filter(id=>ownIds.has(id)).slice(0,4),showGallery:!!v.showGallery,showNotes:!!v.showNotes,gallery:p.gallery.map((g,i)=>({image:Math.max(0,Math.min(7,Number(v['galleryImage'+i])||0)),title:v['galleryTitle'+i],caption:v['galleryCaption'+i]}))};const notes=personEntities(p,'content').map(e=>({id:e.id,title:v['noteTitle_'+e.id],desc:v['noteText_'+e.id]}));profileDraft={person,notes,newNote:v.newNoteTitle.trim()?{title:v.newNoteTitle.trim(),desc:v.newNoteText.trim(),summary:v.newNoteText.trim().slice(0,105)}:null};showModal('Vitrin önizlemesi · Henüz kaydedilmedi',`${profileHero(person,true)}<section class="section"><h2>Hikâyen</h2><p class="profile-bio">${esc(person.bio)}</p><p>${person.featured.length} ilan öne çıkarılacak · Koleksiyon ${person.showGallery?'açık':'kapalı'} · Notlar ${person.showNotes?'açık':'kapalı'}</p></section>${person.showGallery?galleryMarkup(person):''}<section class="section"><h2>Notların</h2>${notes.map(n=>`<h3>${esc(n.title)}</h3><p>${esc(n.desc)}</p>`).join('')}${profileDraft.newNote?`<h3>${esc(profileDraft.newNote.title)}</h3><p>${esc(profileDraft.newNote.desc)}</p>`:''}</section><p class="notice">Kaydetmek yalnızca bu tarayıcıdaki demo vitrini değiştirir. Gerçek kullanıcı sayfasına yayın yapılmaz.</p><div class="row section">${btn('Vitrini kaydet · Demo','publish-profile','','btn primary')}${btn('Vazgeç / yeniden düzenle','cancel-profile-preview')}</div>`)});

function cleanFit(p){const valid=(k,vs)=>vs.includes(p[k])?p[k]:'';return {mode:p.mode==='experienced'||(!p.mode&&p.experience?.length)?'experienced':'new',room:valid('room',['Salon','Yatak odası','Çalışma odası','Mutfak','Banyo','Koridor / antre','Kapalı balkon','Diğer iç mekân']),light:valid('light',['low','bright','sun','dark']),humidity:valid('humidity',['dry','normal','high']),care:valid('care',['low','regular']),warmth:valid('warmth',['stable','cold']),safety:valid('safety',['yes','no']),experience:p.mode!=='new'&&Array.isArray(p.experience)?[...new Set(p.experience.filter(x=>fitCatalog.some(s=>s.id===x)))]:[],duration:valid('duration',['new','months','year']),health:valid('health',['healthy','struggling']),consent:!!p.consent};}
function fitAssess(s,p){if(!s)return {status:'unknown',reasons:['Bu bitkinin türü için yeterli veri yok. Satıcıdan tam tür adını iste.']};const reasons=[],missing=[],changes=[];let no=false;
if(!p.light)missing.push('Işık koşulunu belirt.');else if(p.light==='dark'){no=true;reasons.push('Gün ışığı veya uygun yetiştirme ışığı olmayan konum bu değerlendirmedeki bitkilere uygun değil.')}else if(!s.light.includes(p.light))changes.push(p.light==='sun'?'Sert doğrudan güneşi perdeyle filtrele veya konumu değiştir.':'Daha aydınlık, dolaylı ışık alan bir konum seç.');else reasons.push('Seçtiğin ışık koşulu bu bitkinin temel ihtiyacıyla örtüşüyor.');
if(!p.warmth)missing.push('Sıcaklık koşulunu belirt.');else if(p.warmth==='cold')changes.push('Soğuk veya cereyanlı konum yerine istikrarlı, ılık bir alan değerlendir.');
if(s.humidity!=='any'){if(!p.humidity)missing.push('Ortamın nemini belirt.');else if((s.humidity==='high'&&p.humidity!=='high')||p.humidity==='dry')changes.push('Bu bitki için ortam nemini artırman gerekebilir.');}
if(!p.care)missing.push('Bakım için ayırabileceğin zamanı belirt.');else if(p.care==='low'&&s.care==='regular')changes.push('Düzenli toprak ve yaprak kontrolü için bir bakım planı gerekli.');
if(!p.safety)missing.push('Çocuk / evcil hayvan erişimi tercihini belirt.');else if(p.safety==='yes')missing.push('Bu prototip temas güvenliğini doğrulamıyor; tür bazında güvenilir bilgi olmadan uygun sonucu veremiyoruz.');
if(p.mode==='experienced'&&!p.experience.length)missing.push('Benzer ihtiyaçları karşılaştırmak için baktığın en az bir bitkiyi seç.');
if(p.mode==='experienced'&&p.experience.length){if(!p.experience.some(id=>fitSpecies.some(s=>s.id===id)))missing.push('Seçtiğin bitkilerin ayrıntılı bakım profili henüz yok. Benzerlik önerisi için bakım profili mevcut bir tür seç veya ilk bitki akışında yalnız koşullarını değerlendir.');const names=p.experience.map(id=>fitCatalog.find(x=>x.id===id)?.name).join(', ');reasons.push(`${names} deneyimin kaydedildi. ${p.health==='healthy'&&['months','year'].includes(p.duration)?'Sürdürdüğün bakım alışkanlığı bir başlangıç avantajı; farklı tür veya oda için garanti değil.':'Deneyim süresi ve gelişim durumu netleşmeden başarı varsaymıyoruz.'}`)}else reasons.push('Yeni başlayabilirsin; önceki bitki deneyimi zorunlu değil.');
return {status:no?'no':missing.length?'unknown':changes.length?'change':'yes',reasons:[...reasons,...changes,...missing]};}
const fitLabels={yes:'Uygun görünüyor',change:'Bir değişiklik gerekiyor',no:'Mevcut koşullara uygun görünmüyor',unknown:'Bilgi eksik'};
function fitSelect(label,name,items){return `<label>${label}<select name="${name}"><option value="">Bilmiyorum / henüz seçmedim</option>${options(items,fitProfile[name])}</select></label>`}
function fitSimilarity(s,p){
 if(p.mode!=='experienced')return {score:0,note:''};
 const matches=p.experience.map(id=>fitSpecies.find(x=>x.id===id)).filter(Boolean).map(x=>{const shared=[];if(s.light.some(v=>x.light.includes(v)))shared.push('ışık');if(s.humidity===x.humidity)shared.push('nem');if(s.care===x.care)shared.push('bakım sıklığı');return {score:shared.length,note:shared.length?`${x.name} ile ${shared.join(', ')} ihtiyaçları benziyor.`:''}}).sort((a,b)=>b.score-a.score);

}
function fitCandidates(p){return fitSpecies.filter(s=>p.mode!=='experienced'||!p.experience.includes(s.id)).filter(s=>fitAssess(s,p).status==='yes').map(s=>({s,match:fitSimilarity(s,p)})).filter(x=>p.mode!=='experienced'||x.match.score>=2).sort((a,b)=>b.match.score-a.match.score).map(x=>x.s)}
function fitResult(s){const r=fitAssess(s,fitProfile);return `<article class="fit-result ${r.status}"><span class="pill">${fitLabels[r.status]}</span><h3>${esc(s?.name||'Türü doğrulanmamış bitki')}</h3>${s&&fitProfile.mode==='experienced'?`<p><b>${esc(fitSimilarity(s,fitProfile).note||'Mevcut bitkilerinle belirgin bakım benzerliği bulunamadı.')}</b></p>`:''}<ul>${r.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${s?`<a href="${s.source}" target="_blank" rel="noopener noreferrer">Bakım kaynağı ↗</a>`:''}<p class="meta">Ön değerlendirme · Başarı garantisi değildir.</p></article>`}
function fitView(){const target=fitSpecies.find(s=>s.id===fitTarget);const good=fitCandidates(fitProfile);return `${breadcrumb(hub())}<div class="fit-heading"><span class="eyebrow">SENİN EVİN · SENİN RİTMİN</span><h1>${fitTarget?'Bu bitki bana uygun mu?':'Bir sonraki bitkini birlikte bulalım.'}</h1><p>İlk bitkini seçebilir veya mevcut bitkilerine benzer ihtiyaçları olan yeni türler keşfedebilirsin.</p>${fitTarget?`<p class="pill">Değerlendirilen: ${esc(target?.name||'Türü doğrulanmamış bitki')}</p>`:''}</div><div class="fit-layout"><form class="form panel" data-form="plant-fit"><h2>Bakım profilin</h2><fieldset><legend>Nasıl başlayalım?</legend><label class="check-row"><input type="radio" name="mode" value="new" ${fitProfile.mode==='new'?'checked':''}>İlk bitkimle başlayacağım</label><label class="check-row"><input type="radio" name="mode" value="experienced" ${fitProfile.mode==='experienced'?'checked':''}>Zaten bitki bakıyorum</label></fieldset><div id="fit-experience" ${fitProfile.mode==='new'?'hidden':''}><fieldset><legend>Şu anda baktığın bitkiler</legend>${fitPicker()}</fieldset><div class="grid2">${fitSelect('Ne kadar süredir?','duration',[{id:'new',name:'Yeni başladım'},{id:'months',name:'Birkaç aydır'},{id:'year',name:'Bir yıl veya daha uzun'}])}${fitSelect('Genel durumları','health',[{id:'healthy',name:'Sağlıklı / gelişiyor'},{id:'struggling',name:'Bakımda zorlanıyorum'}])}</div></div>${fitSelect('Yeni bitkinin duracağı yer','room',['Salon','Yatak odası','Çalışma odası','Mutfak','Banyo','Koridor / antre','Kapalı balkon','Diğer iç mekân'])}<p class="meta">Odanın adı ışık ve nemi belirlemez; aşağıda bu konumun koşullarını seç.</p><div class="grid2">${fitSelect('Bu konumdaki ışık','light',[{id:'bright',name:'Aydınlık, dolaylı ışık'},{id:'low',name:'Az gün ışığı'},{id:'sun',name:'Sert doğrudan güneş'},{id:'dark',name:'Gün ışığı / bitki ışığı yok'}])}${fitSelect('Ortam nemi','humidity',[{id:'dry',name:'Kuru'},{id:'normal',name:'Orta'},{id:'high',name:'Yüksek'}])}${fitSelect('Sıcaklık','warmth',[{id:'stable',name:'Ilık ve istikrarlı'},{id:'cold',name:'Soğuk / cereyanlı'}])}${fitSelect('Bakım alışkanlığın','care',[{id:'low',name:'Seyrek ilgilenebilirim'},{id:'regular',name:'Düzenli kontrol edebilirim'}])}</div>${fitSelect('Çocuk / evcil hayvan erişimi için güvenlik kontrolü gerekli mi?','safety',[{id:'yes',name:'Evet'},{id:'no',name:'Bu değerlendirmeye dahil etme'}])}<label class="check-row"><input type="checkbox" name="consent" ${fitProfile.consent?'checked':''}>Profilimi yalnız bu tarayıcıda hatırla</label><p class="meta">Üyelik gerekmez. Cevapların paylaşım adresine veya indirilen demo dosyasına eklenmez.</p><button class="btn primary">${fitDone?'Değerlendirmeyi güncelle':'Uygunluğu değerlendir'}</button>${btn('Cevaplarımı sil','fit-clear','','linkbtn')}</form><section aria-live="polite" id="fit-results"><h2>${fitDone?(esc(fitProfile.room||'Seçtiğin konum')+' için değerlendirme'):'Sana göre bir başlangıç'}</h2>${fitDone?`${fitTarget?fitResult(target):`<p>${fitProfile.mode==='experienced'?'Mevcut bitkilerine benzer ihtiyaçları olan ve koşullarına uyan adaylar.':'Yalnızca seçtiğin ortam ve bakım koşullarına uyan adaylar.'}</p>${good.length?good.map(fitResult).join(''):`<div class="fit-empty"><h3>Henüz uygun aday bulamadık</h3>${fitProfile.experience.some(id=>!fitSpecies.some(s=>s.id===id))?'<p>Seçtiğin bazı türlerin bakım verileri eksik; bu seçimlerden benzerlik çıkarılmadı.</p>':''}<p>Beş türlük demo kataloğunda bu bilgilerle eşleşme yok. Koşullarını ve boş bıraktığın alanları gözden geçir; gerçek koşullarını değiştirmeden farklı cevap seçmen gerekmez.</p>${fitProfile.mode==='experienced'&&!fitProfile.experience.length?'<p>Baktığın bitkilerden en az birini seç.</p>':''}</div>`}`}<p class="meta">Bakım bilgileri RHS kaynaklarına dayanır. Eşleştirme kuralları demo v0.1 · 4 Ekim 2026. Işık, nem ve zaman seçenekleri basitleştirilmiştir; hastalık, toprak ve tüm ev koşulları değerlendirilmez.</p>${fitTarget?btn('Diğer bitkileri de
