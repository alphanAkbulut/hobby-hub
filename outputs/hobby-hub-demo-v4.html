document.addEventListener('submit',e=>{const f=e.target,k=f.dataset.form;if(!['qa-send','qa-answer','qa-prefs'].includes(k))return;e.preventDefault();if(!currentUser)return toast('Önce giriş yap.');const v=Object.fromEntries(new FormData(f).entries()),fail=msg=>f.querySelector('.form-error').textContent=msg;const before=copy(data.discussions);if(k==='qa-prefs'){const old=data.questionPrefs[currentUser];data.questionPrefs[currentUser]={public:!!v.public,private:!!v.private};if(!save()){data.questionPrefs[currentUser]=old;return toast('Tercihler kaydedilemedi.')}qaInbox();return}if(k==='qa-send'){const t=qaTarget(f.dataset.id);if(!t||t.owner===currentUser)return fail('Geçerli bir alıcı seç.');const prefs=data.questionPrefs[t.owner]||{public:true,private:true};if(!['public','private'].includes(v.visibility)||!prefs[v.visibility])return fail('Alıcı bu görünürlükte soru kabul etmiyor.');if(!v.body||v.body.trim().length<10||v.body.length>1000)return fail('Sorun 10–1000 karakter olmalı.');if(data.discussions.filter(q=>q.from===currentUser&&q.day===new Date().toISOString().slice(0,10)).length>=10)return fail('Demo günlük 10 soru sınırına ulaştın.');data.discussions.push({id:uid(),target:t.id,from:currentUser,to:t.owner,private:v.visibility==='private',body:v.body.trim(),answer:'',day:new Date().toISOString().slice(0,10)});}else{const q=data.discussions.find(x=>x.id===f.dataset.id);if(!q||q.hidden||q.to!==currentUser)return fail('Yanıt yetkin yok.');if(!v.body||v.body.trim().length<5||v.body.length>2000)return fail('Yanıt 5–2000 karakter olmalı.');q.answer=v.body.trim();}if(!save()){data.discussions=before;return fail('Kaydedilemedi.')}qaInbox();});

// Learning pilot: local demo state; no background YouTube polling.
const learningRoutes=[{id:'first',title:'İlk baskına hazırlan',intro:'Yazıcını tanı, kaynağı incele ve kendi kontrol listeni oluştur.',steps:[['Yazıcını ve malzemeni tanı','Modelini, baskı yüzeyini ve filamentini not et. Üreticinin kendi kullanım kılavuzunu esas al.',''],['Filament yüklemeyi gözlemle','Prusa arşiv videosu · 2016 · İngilizce. Eski modele ait adımları kendi yazıcına doğrudan uygulama.','DEH1LBoS00Q'],['Kendi hazırlık listeni yaz','Kendi cihazının kılavuzuna göre baskı öncesinde kontrol edeceğin üç şeyi not et.','']]},{id:'layer',title:'İlk katmanı anlamaya başla',intro:'Gözlem yap, cihazına uygun yöntemi seç ve sonucunu kaydet.',steps:[['Önce gözlemle','Prusa arşiv videosu · 2016 · İngilizce. Ayarlar ve baskı yüzeyi cihazına göre değişir.','eOjDVSXg3Oo'],['Kendi koşullarını karşılaştır','Baskı yüzeyini, malzemeni ve sorunun ne zaman oluştuğunu not et. Güncel cihaz kılavuzuyla karşılaştır.',''],['Deneyimini paylaş','Uyguladığın yöntemi ve sonucu bir fotoğrafla topluluğa anlat. Tamamlamak, uzmanlık kazanıldığı anlamına gelmez.','']]}];
function learningStore(){if(!data.learning)data.learning={};return data.learning}
function learningUser(){if(!currentUser)return null;return learningStore()[currentUser]||(learningStore()[currentUser]={premium:false,channels:[],alerts:[],routes:{}})}
function channelURL(raw){try{const u=new URL(raw);if(u.protocol!=='https:'||!['youtube.com','www.youtube.com'].includes(u.hostname)||u.username||u.password||u.port)return '';if(!/^\/(?:@[A-Za-z0-9_.-]+|channel\/UC[A-Za-z0-9_-]{22})\/?$/.test(u.pathname))return '';return 'https://www.youtube.com'+u.pathname.replace(/\/$/,'')}catch{return ''}}
function followChannel(name,url){const p=learningUser();if(!p?.premium)return 'Kişisel kanal takibi için Premium demo üyeliğini aç.';url=channelURL(url);if(!url)return 'Geçerli bir https://www.youtube.com/@kanal veya /channel/UC… adresi gir.';if(!name.trim()||name.length>80)return 'Kanal adı 1–80 karakter olmalı.';if(p.channels.some(c=>c.url===url))return 'Bu kanal zaten listende.';p.channels.push({id:uid(),name:name.trim(),url,notify:true});save();return ''}
function simulateVideo(){const p=learningUser();if(!p?.premium)return;for(const c of p.channels.filter(c=>c.notify)){const key=c.id+':example-1';if(!p.alerts.some(a=>a.key===key))p.alerts.push({key,channel:c.id,name:c.name,read:false})}save()}
function learningShelf(){return `<section class="panel section"><span class="eyebrow">İzle · Dene · Paylaş</span><h2>Birlikte öğrenmeye başla</h2><p>3D/Maker pilotu · Herkese açık iki kısa rota. Notlarını ve ilerlemeni ücretsiz demo hesabında sakla.</p><div class="grid3">${learningRoutes.map(r=>`<article class="panel"><h3>${r.title}</h3><p>${r.intro}</p><p class="meta">3 adım · Başlangıç</p>${btn('Rotayı aç','learn-route',r.id)}</article>`).join('')}<article class="panel"><h3>Editörün kaynak seçimi</h3><p>Prusa Research · 3D baskı</p><p>Üreticinin kendi eğitim arşivi. Videoların cihaz ve tarih bilgisini rota içinde gösteriyoruz.</p><a href="https://blog.prusa3d.com/youtube-quick-tips_4116/" target="_blank" rel="noopener noreferrer">Kaynağı incele ↗</a></article></div><div class="section">${btn('Kişisel kanallarım & bildirimler','learn-library')}<p class="meta">Premium: kendi kanal listen ve takip tercihlerin. Videoları izlemek ücretsiz.</p></div></section>`}
function openRoute(id,index=0){const r=learningRoutes.find(r=>r.id===id);if(!r)return;index=Math.max(0,Math.min(2,index));const s=r.steps[index],p=learningUser(),progress=p?.routes[id]||{done:[],notes:{}};showModal(r.title,`<h1>${r.title}</h1><p>Adım ${index+1} / 3 · ${progress.done.length}/3 tamamlandı</p><nav class="row">${r.steps.map((x,i)=>btn((progress.done.includes(i)?'✓ ':'')+(i+1)+'. '+x[0],'learn-step',id+':'+i,i===index?'btn primary':'btn')).join('')}</nav><h2>${s[0]}</h2><p>${s[1]}</p>${s[2]?`<div id="learning-player">${btn('Videoyu burada yükle','learn-play',s[2])}<p class="meta">Tıklayınca YouTube bağlantısı kurulur. Otomatik oynatma yoktur.</p></div><a href="https://www.youtube.com/watch?v=${s[2]}" target="_blank" rel="noopener noreferrer">YouTube’da aç ↗</a><p class="meta">Yerel HTML dosyasında oynatıcı çalışmayabilir; kaynak bağlantısını kullanabilirsin.</p>`:''}${p?`<form class="form section" data-form="learn-note" data-id="${id}:${index}"><label>Bu adımdaki notum<textarea name="note" maxlength="1500">${esc(progress.notes[index]||'')}</textarea></label><label><input type="checkbox" name="done" ${progress.done.includes(index)?'checked':''}> Bu adımı tamamladım</label><button class="btn primary">Notu ve ilerlemeyi kaydet</button></form>`:`<p>İlerleme ve notlarını saklamak için ücretsiz demo hesabını seç.</p>${btn('Giriş yap','account')}`}<div class="section">${index<2?btn('Sonraki adım →','learn-step',id+':'+(index+1)):btn('Deneyimini paylaş','add-media')}</div>`)}
function learningLibrary(){const p=learningUser();if(!p)return accountDialog();showModal('Kişisel kanallarım',`<h1>Kişisel kanallarım</h1><p class="notice">Yerel demo · Kanal adresleri kaydedilir; YouTube’dan veri çekilmez. Yeni video bildirimi aşağıdaki düğmeyle simüle edilir. Gerçek abonelik veya ödeme yoktur.</p><p>Üyelik: <b>${p.premium?'Premium · Demo':'Ücretsiz'}</b> ${btn(p.premium?'Premium’u kapat':'Premium’u dene','learn-premium')}</p>${p.premium?`<form class="form" data-form="learn-channel"><label>Kanal adı<input name="name" required maxlength="80"></label><label>YouTube kanal adresi<input name="url" type="url" placeholder="https://www.youtube.com/@kanal" required></label><p class="meta">Bu liste 3D/Maker içindir. Eklediğin kanalın hobiyle ilgisini canlı sürümde doğrulayacağız.</p><p class="form-error" role="alert"></p><button class="btn primary">Listeme ekle</button></form>`:'<p>Kişisel kanal ekleme ve yeni video bildirimleri Premium ile açılır. Rotalar herkese açıktır.</p>'}<div class="section">${p.channels.map(c=>`<article class="panel"><h3>${esc(c.name)}</h3><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">Kanal ↗</a><p class="meta">İçerik henüz senkronize edilmedi.</p>${btn(c.notify?'Bildirim açık':'Bildirim kapalı','learn-notify',c.id)} ${btn('Takibi bırak','learn-remove',c.id)}</article>`).join('')||'<p>Henüz eklediğin kanal yok.</p>'}</div>${p.premium?btn('Yeni video gelişini simüle et','learn-simulate'):''}<h2>Bildirimler · ${p.alerts.filter(a=>!a.read).length} okunmamış</h2>${p.alerts.map(a=>`<p>${a.read?'✓':'●'} ${esc(a.name)}: örnek yeni video bildirimi · Simülasyon</p>`).join('')||'<p>Yeni bildirim yok. Bir kanalı eklemek bildirim oluşturmaz.</p>'}${p.alerts.length?btn('Okundu işaretle','learn-read'):''}`)}
const learningView=userView;userView=function(h){const html=learningView(h);return h.id==='maker'&&state.tab==='content'&&!state.profile&&!state.searching&&!state.favorites?html.replace('<div class="grid3">',learningShelf()+'<div class="grid3">'):html};
const learningAccount=accountDialog;accountDialog=function(){learningAccount();if(currentUser)$('#modal-body').innerHTML+=`<div class="section">${btn('Kişisel kanallarım & bildirimler','learn-library')}</div>`};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,id}=b.dataset;if(!action.startsWith('learn-'))return;if(action==='learn-route')return openRoute(id);if(action==='learn-step'){const [r,i]=id.split(':');return openRoute(r,Number(i))}if(action==='learn-play'){if(!learningRoutes.some(r=>r.steps.some(s=>s[2]===id)))return;$('#learning-player').innerHTML=`<iframe title="Eğitim videosu" src="https://www.youtube-nocookie.com/embed/${id}" style="width:100%;aspect-ratio:16/9;border:0" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;return}if(action==='learn-library')return learningLibrary();const p=learningUser();if(!p)return accountDialog();if(action==='learn-premium')p.premium=!p.premium;if(action==='learn-notify'){const c=p.channels.find(c=>c.id===id);if(c)c.notify=!c.notify}if(action==='learn-remove'){p.channels=p.channels.filter(c=>c.id!==id);p.alerts=p.alerts.filter(a=>a.channel!==id)}if(action==='learn-simulate')simulateVideo();if(action==='learn-read')p.alerts.forEach(a=>a.read=true);save();learningLibrary()});
document.addEventListener('submit',e=>{const f=e.target;if(!['learn-note','learn-channel'].includes(f.dataset.form))return;e.preventDefault();const p=learningUser();if(!p)return accountDialog();const v=Object.fromEntries(new FormData(f).entries());if(f.dataset.form==='learn-channel'){const err=followChannel(v.name||'',v.url||'');if(err)return f.querySelector('.form-error').textContent=err;return learningLibrary()}const [id,n]=f.dataset.id.split(':'),i=Number(n);if(!learningRoutes.some(r=>r.id===id)||![0,1,2].includes(i))return;const r=p.routes[id]||(p.routes[id]={done:[],notes:{}});r.notes[i]=(v.note||'').slice(0,1500);r.done=r.done.filter(x=>x!==i);if(v.done)r.done.push(i);save();openRoute(id,i)});

readRoute();render('replace');
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'navigate_hobby',title:'Hobi sayfasını aç',description:'Yerel Hobby Hub demosunda belirtilen hobinin keşfet sayfasını açar.',inputSchema:{type:'object',properties:{hobbyId:{type:'string'}},required:['hobbyId'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input.hobbyId!=='string'||!hub(input.hobbyId)?.active)throw new Error('Geçerli ve aktif hobi kimliği gerekli.');goHub(input.hobbyId);return{hobbyId:state.hub,title:hub().name,tab:state.tab}}})).catch(()=>{});}catch(e){}}
</script></body></html>
