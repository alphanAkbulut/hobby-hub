function tree(h,parent='',depth=0){return allNodes(h).filter(c=>c.parent===parent).map(c=>{const kids=allNodes(h).some(n=>n.parent===c.id);const count=data.listings.filter(l=>visibleListing(l)&&l.hub===h.id&&descendants(c.id,h).has(l.cat)).length;const b=`<button data-action="category" data-id="${esc(c.id)}" class="node ${state.cat===c.id?'active':''}"><span>${esc(c.name)}</span><small>${count}</small></button>`;return kids?`<details ${depth<1||descendants(c.id,h).has(state.cat)?'open':''}><summary>${esc(c.name)} <small>(${count})</small></summary><div class="branch">${b}${tree(h,c.id,depth+1)}</div></details>`:b}).join('')}
function facetSelect(label,key,vals){return `<div class="facet"><h3>${esc(label)}</h3><select data-filter="${esc(key)}" aria-label="${esc(label)}"><option value="">Tümü</option>${vals.map(v=>`<option value="${esc(v)}" ${state.filters[key]===v?'selected':''}>${esc(v)} (${listings(key).filter(l=>(key==='city'||key==='type'||key==='delivery'?l[key]:String(l.attrs?.[key]??'').split(',').includes(v)?v:'')===v).length})</option>`).join('')}</select></div>`}
function sidebar(h){const allSearch=state.searching&&state.scope==='all';return `${btn('Kapat','filters-close','','btn mobile-close')}<h2>Hobi haritası</h2>${allSearch?`<p class="muted" style="font-size:14px">Tüm hobilerde aranıyor. Özel filtreler için bir hobi seç.</p>`:`<div class="tree"><button data-action="category" data-id="" class="node ${!state.cat?'active':''}"><b>Tüm ${esc(h.name.toLocaleLowerCase('tr-TR'))}</b><small>${data.listings.filter(l=>visibleListing(l)&&l.hub===h.id).length}</small></button>${tree(h)}</div>`}<div class="block"><h2>İlan filtreleri</h2><p class="meta">Bu filtreler yalnızca ilanları daraltır.</p><div class="facet"><h3>Fiyat aralığı · TL</h3><form id="price-form"><div class="range"><input type="number" min="0" name="min" placeholder="En az" aria-label="En az fiyat" value="${esc(state.filters.min||'')}"><input type="number" min="0" name="max" placeholder="En çok" aria-label="En çok fiyat" value="${esc(state.filters.max||'')}"></div><button class="linkbtn">Fiyatı uygula</button></form></div>${facetSelect('Konum','city',[...new Set(data.listings.map(l=>l.city))])}${facetSelect('İlan türü','type',[...new Set((allSearch?data.hubs:[h]).flatMap(h=>h.listingTypes))])}${facetSelect('Teslimat','delivery',['Elden teslim','Kargo','Kargo veya elden'])}${!allSearch?h.attributes.filter(a=>a.filterable&&(!a.category||!state.cat||descendants(a.category,h).has(state.cat)||descendants(state.cat,h).has(a.category))).map(a=>a.type==='number'?`<div class="facet"><h3>${esc(a.name)} ${esc(a.unit||'')}</h3><select data-filter="${esc(a.id)}" aria-label="${esc(a.name)}"><option value="">Tümü</option>${options([...new Set(data.listings.filter(l=>l.hub===h.id).map(l=>String(l.attrs[a.id]??'')).filter(Boolean))],state.filters[a.id])}</select></div>`:facetSelect(a.name,a.id,a.type==='boolean'?['Evet','Hayır']:a.options)).join(''):''}${btn('Filtreleri temizle','clear-filters','','linkbtn')}</div><div class="block"><div class="overview-tile"><div class="eyebrow">İlk adım</div><h3>Yeni bir meraka yer aç.</h3><p style="font-size:13px">Topluluğun rehberleriyle başla.</p>${btn('Rehberleri keşfet','tab','content','linkbtn')}</div></div>`}
function card(l){return `<article class="card"><div class="cover"><button class="card-img" data-action="listing" data-id="${l.id}" aria-label="${esc(l.title)} detayını aç">${photo(l.image,'',l.title+' — temsili görsel')}</button><button class="fav ${data.favorites.includes(l.id)?'saved':''}" data-action="favorite" data-id="${l.id}" aria-label="${esc(l.title)} ${data.favorites.includes(l.id)?'kaydını kaldır':'kaydet'}" aria-pressed="${data.favorites.includes(l.id)}">${data.favorites.includes(l.id)?'♥':'♡'}</button>${l.promoted?'<span class="pill gold">Sponsorlu</span>':l.type==='Kendi üretimi'?'<span class="pill">Hobi üreticisinden</span>':''}</div><div class="card-body"><span class="meta">${esc(l.seller)} · ${esc(l.city)}</span><button class="card-title" data-action="listing" data-id="${l.id}">${esc(l.title)}</button><div class="row between"><span class="price">${money(l.price)}</span><span class="meta">${esc(l.condition)}</span></div></div></article>`}
function entityCard(e){return `<article class="entity-card">${photo(e.image,'',e.title+' — temsili görsel')}<div class="inside"><div class="row between"><span class="pill ${e.kind==='offer'?'gold':e.kind==='course'?'blue':''}">${esc(e.tag||kindNames[e.kind])}</span>${e.promoted?'<small>Sponsorlu</small>':''}</div><h3 style="margin-top:12px">${esc(e.title)}</h3><p class="muted">${esc(e.summary||e.desc.slice(0,95))}</p><p class="meta">${esc(e.source||e.seller)}${e.city?' · '+esc(e.city):''}</p>${btn(e.kind==='service'?'Uzmanı incele':e.kind==='course'?'Programı gör':e.kind==='offer'?'Koşulları gör':'İncele','entity',e.id,'btn small')}</div></article>`}
function section(kind,limit=3){const records=entities(kind).slice(0,limit);if(!records.length)return '';return `<section class="section"><div class="section-head"><h2>${{content:'Merakını besle',service:'İşini bilen insanlarla tanış',course:'Birlikte öğren, birlikte yap',offer:'Hobine küçük bir avantaj',community:'Topluluktan ilham al'}[kind]}</h2>${btn('Tümünü gör','tab',kind,'linkbtn')}</div><div class="grid3">${records.map(entityCard).join('')}</div></section>`}
function listingResults(){const list=listings();return `<div class="toolbar"><div><b>${list.length} ilan</b> <span class="meta">${state.cat?esc(path(state.cat)):''}</span></div><div class="row">${btn('Aramayı kaydet','save-search','','btn small')}<select id="sort" aria-label="İlan sıralaması">${options([{id:'recommended',name:'Önerilen sıralama'},{id:'new',name:'En yeni'},{id:'low',name:'Fiyat: artan'},{id:'high',name:'Fiyat: azalan'}],state.sort)}</select></div></div><div class="chips">${Object.entries(state.filters).filter(([,v])=>v).map(([k,v])=>btn(esc((hub().attributes.find(a=>a.id===k)?.name||{min:'En az',max:'En çok',city:'Konum',type:'Tür',delivery:'Teslimat'}[k]||k)+': '+v)+' ×','remove-filter',k,'chip active')).join('')}</div>${list.length?`<div class="cards all">${list.map(card).join('')}</div>`:`<div class="empty"><h2>Henüz eşleşen ilan yok</h2><p>Fiyatı genişlet veya bir üst kategoriye dön.</p>${btn('Filtreleri temizle','clear-filters')} ${btn('Tüm ilanları gör','all-listings')}</div>`}`}
function userView(h){const activeSections=h.sections.filter(s=>s.enabled);if(state.tab!=='discover'&&!activeSections.some(s=>s.id===state.tab))state.tab='discover';return `<div class="crumb">${btn('Hobiler','home','','linkbtn')} <span>›</span> ${esc(h.name)}${state.cat?' › '+esc(path(state.cat)):''}</div><div class="row between">${btn('☷ Kategoriler ve filtreler','filters-open','','btn filter-toggle')}${state.favorites?'<h1>Kaydettiklerim</h1>':''}</div>${state.searching?`<h1 style="margin-top:15px">“${esc(state.query)}” için sonuçlar</h1><p class="muted">${state.scope==='all'?'Tüm hobilerde':esc(h.name)+' içinde'} ilanlar, içerikler, uzmanlar ve etkinlikler</p>`:state.favorites?`<p class="muted">Bu cihazda kaydettiğin ilanlar. ${btn('Tüm hobilerde göster','favorites-all','','linkbtn')}</p>`:state.tab==='discover'?`<section class="hero"><div><span class="eyebrow">${esc(h.kicker)}</span><h1>${esc(h.headline)}</h1><p>${esc(h.subtitle)}</p></div><div class="hero-art" aria-hidden="true">${photo(h.image)}${photo((h.image+1)%8)}</div></section>`:`<div class="row between"><h1>${state.cat?esc(node(state.cat)?.name):esc(h.name)+' · '+tabNames[state.tab]}</h1>${btn('Hub’a dön','tab','discover','btn small')}</div>`}<nav class="tabs" aria-label="Hobi bölümleri">${[{id:'discover',name:'Keşfet'},...activeSections.map(s=>({id:s.id,name:tabNames[s.id]}))].map(s=>`<button data-action="tab" data-id="${s.id}" class="${state.tab===s.id?'active':''}" aria-current="${state.tab===s.id?'page':'false'}">${s.name}</button>`).join('')}</nav>${state.favorites||state.tab==='market'?listingResults():state.searching&&state.tab==='discover'?`<section class="result-group"><h2>İlanlar</h2>${listingResults()}</section>${['content','service','course','offer','community'].map(k=>{const es=entities(k);return es.length?`<section class="result-group"><h2>${tabNames[k]} <small>(${es.length})</small></h2><div class="grid3">${es.map(entityCard).join('')}</div></section>`:''}).join('')}`:state.tab==='discover'?`<div class="chips">${allNodes(h).filter(c=>c.parent).slice(0,6).map(c=>btn(esc(c.name),'category',c.id,'chip')).join('')}</div>${h.sections.map(s=>{if(!s.enabled)return '';if(s.id==='market')return `<section><div class="section-head"><div><h2>Yeni bir hikâyeye hazır</h2><p>Üretenlerden, biriktirenlerden, senin gibi meraklılardan.</p></div>${btn('Tüm ilanlar ('+listings().length+')','tab','market','linkbtn')}</div>${listings().length?`<div class="cards">${listings().slice(0,4).map(card).join('')}</div>`:'<div class="empty">Bu hobide ilk ilanı sen ekleyebilirsin.</div>'}</section>`;return section(s.id)}).join('')}`:`${state.tab==='community'?`<div class="row between"><p class="muted">Koleksiyonlar, atölyeler ve kullananlardan.</p>${btn('+ Deneyimini paylaş','add-media','','btn')}</div>`:''}<div class="grid3">${entities(state.tab).map(entityCard).join('')}</div>${!entities(state.tab).length?'<div class="empty"><h2>Burada henüz içerik yok</h2><p>Yeni içerikler moderasyon sonrası görünecek.</p></div>':''}`}`}
function listingDetail(id){const l=data.listings.find(l=>l.id===id);if(!l||!visibleListing(l)){toast('Bu ilan artık yayında değil.');render();return}const h=hub(l.hub);showModal('İlan detayı · Örnek ilan',`<div class="detail-grid">${photo(l.image,'',l.title+' — AI temsili görsel')}<div><span class="pill">${esc(l.type)}</span><p class="meta" style="margin-top:12px">${esc(h.name)} › ${esc(path(l.cat,h))}</p><h1>${esc(l.title)}</h1><p class="muted">${esc(l.city)} · ${esc(l.condition)}</p><div class="detail-price">${money(l.price)}</div><p>${esc(l.desc)}</p><div class="specs">${h.attributes.filter(a=>l.attrs[a.id]).map(a=>`<div><small>${esc(a.name)}</small><b>${esc(l.attrs[a.id])} ${esc(a.unit||'')}</b></div>`).join('')}<div><small>Teslimat</small><b>${esc(l.delivery)}</b></div></div><div class="row">${btn('Satıcıya sor · Demo','message',l.id,'btn primary')}${btn(data.favorites.includes(l.id)?'♥ Kaydedildi':'♡ Kaydet','favorite',l.id)}</div><p class="terms" style="margin-top:12px">Ödeme ve alıcı koruması bu demoda bulunmaz.</p><div class="mini"><div class="avatar">${esc(l.seller.slice(0,1))}</div><div><b>${esc(l.seller)}</b><p class="meta" style="margin:0">${esc(l.sellerBio||'Koleksiyonunu ve deneyimini paylaşan hobici.')}</p></div>${btn('Vitrin','seller',l.seller,'linkbtn')}</div></div></div><section class="section"><div class="section-head"><h2>Kullananlardan</h2>${btn('Deneyim ekle','add-media',l.id,'linkbtn')}</div><p class="meta">Temsili kullanım görselleri · Doğrulanmış satın alma değildir.</p><div class="gallery">${[l.image,(l.image%2===0?l.image+1:l.image-1)].map((i,n)=>`<button data-action="gallery" data-id="${i}">${photo(i,'',n?'Koleksiyon detayı':'Evde kullanım örneği')}<p class="meta">${n?'Koleksiyon köşesi':'Yeni evinde'} · Örnek paylaşım</p></button>`).join('')}${data.entities.filter(e=>e.kind==='community'&&e.listing===l.id&&visibleEntity(e)).map(e=>`<button data-action="entity" data-id="${e.id}">${photo(e.image)}<p>${esc(e.title)}</p></button>`).join('')}</div></section><div class="row between section"><span class="meta">İlan no: ${esc(l.id)} · Örnek veri</span>${btn('İlanı bildir','report',l.id,'linkbtn')}</div>`)}
function sellerProfile(name){const ls=data.listings.filter(l=>visibleListing(l)&&l.seller===name),first=ls[0];const related=data.entities.filter(e=>visibleEntity(e)&&e.seller===name);showModal('Üretici / satıcı vitrini',`<section class="seller-banner"><div class="row"><div class="avatar">${esc(name.slice(0,1))}</div><div><h1>${esc(name)}</h1><p>${esc(first?.sellerBio||'İşini ve merakını paylaşan bir hobi atölyesi.')}</p><small style="color:#cfdfd4">${esc(first?.city||related[0]?.city||'İstanbul')} · Demo profil</small></div></div>${btn(data.following.includes(name)?'Takip ediliyor':'Takip et','follow',name,'btn lime')}</section><div class="section"><h2>Atölyeden & koleksiyondan</h2><div class="gallery">${[first?.image??related[0]?.image??0,((first?.image??related[0]?.image??0)+1)%8].map(i=>`<button data-action="gallery" data-id="${i}">${photo(i)}<p class="meta">Atölye vitrini · Temsili görsel</p></button>`).join('')}</div></div><section class="section"><h2>Yayındaki ilanlar <small>(${ls.length})</small></h2><div class="cards all">${ls.map(card).join('')}</div></section>${related.length?`<section class="section"><h2>Hizmetler ve paylaşımlar</h2><div class="grid3">${related.map(entityCard).join('')}</div></section>`:''}<section class="section panel"><h3>Bu profilin hikâyesi</h3><p>${esc(first?.sellerBio||'Uzmanlık, portfolyo ve müşteri deneyimleri aynı vitrinde buluşur.')}</p><p class="meta">Değerlendirme akışı gerçek işlemlerle birlikte açılacak. Demoda sahte doğrulanmış yorum kullanılmaz.</p></section>`)}
function entityDetail(id){const e=data.entities.find(x=>x.id===id);if(!e||!visibleEntity(e)){toast('İçerik yayında değil.');return}showModal(kindNames[e.kind]+' · Demo',`<div class="detail-grid">${photo(e.image,'',e.title+' — temsili görsel')}<div><span class="pill">${esc(e.tag||kindNames[e.kind])}</span>${e.promoted?'<span class="pill gold">Sponsorlu</span>':''}<h1>${esc(e.title)}</h1><p class="meta">${esc(e.source||e.seller)} · ${esc(hub(e.hub).name)}</p><p>${esc(e.desc)}</p>${e.kind==='course'?`<div class="specs"><div><small>Tarih</small><b>${esc(e.date||'24 Ekim 2026 · 14.00')}</b></div><div><small>Katılım</small><b>${esc(e.city||'Çevrimiçi')} · ${esc(e.level||'Başlangıç')}</b></div><div><small>Süre</small><b>${esc(e.duration||'2 saat')}</b></div><div><small>Ücret</small><b>${money(e.price||0)}</b></div></div><p class="meta">${e.capacity??8} kişilik örnek kontenjan · ${e.capacity===0?'Kontenjan dolu':'Başvuru organizatör onayına bağlı'}</p>${btn(e.capacity===0?'Bekleme listesi · Demo':'Katılım talebi · Demo','request',e.id,'btn primary')}`:e.kind==='service'?`<div class="specs"><div><small>Konum</small><b>${esc(e.city)}</b></div><div><small>Çalışma şekli</small><b>${esc(e.mode||'Randevuyla / yerinde')}</b></div></div><p><b>${money(e.price||650)}’den başlayan</b> örnek ücret. Kesin bedel uzman teklifiyle netleşir.</p><div class="row">${btn('Teklif iste · Demo','request',e.id,'btn primary')}${btn('Uzman vitrini','seller',e.seller)}</div>`:e.kind==='offer'?`<div class="notice">${esc(e.terms||'Örnek kampanya: seçili ürünlerde %10 indirim, 1.000 TL alt limit, tek kullanım. Diğer kampanyalarla birleşmez. 31 Ekim 2026’ya kadar.')}<br><b>Bu kupon gerçek alışverişte kullanılamaz.</b></div><div class="section">${btn('Demo kuponunu göster','coupon',e.id,'btn primary')}</div>`:e.kind==='content'?`<div class="notice">${esc(e.sourceNote||'Editoryal demo metni. Dış kaynakların tam içerikleri kopyalanmamıştır.')}</div>${e.url?`<p class="section"><a class="btn" href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">Kaynağı yeni sekmede aç</a></p>`:''}`:`<p class="notice">Kullanıcı paylaşımı örneği · Satın alma doğrulanmamıştır.</p>${btn('Deneyimini paylaş','add-media',e.listing||'','btn primary')}`}</div></div>${e.kind==='service'?`<section class="section"><h2>Yapılan işler</h2><div class="gallery">${[e.image,(e.image+1)%8].map(i=>`<button data-action="gallery" data-id="${i}">${photo(i)}<p class="meta">Portfolyo örneği · Temsili</p></button>`).join('')}</div></section>`:''}<section class="section">${btn('İçeriği bildir','report',e.id,'linkbtn')}</section>`)}
function requestForm(id,isMessage=false){const e=data.entities.find(e=>e.id===id)||data.listings.find(l=>l.id===id);const prior=data.requests.find(r=>r.item===id);showModal(isMessage?'Satıcıya soru · Yerel demo':'Talep oluştur · Yerel demo',`<div class="content-copy"><h1>${esc(e.title)}</h1><p class="notice">Bu form yalnızca demo kaydı oluşturur. Hiç kimseye mesaj veya başvuru gönderilmez; ödeme alınmaz.</p>${prior?`<p class="pill">Bu kayıt için daha önce demo talebi oluşturdun.</p>`:''}<form class="form" data-form="request" data-id="${id}"><label>Mesajın<textarea name="message" required minlength="10" maxlength="1000" placeholder="İhtiyacını veya sormak istediğini yaz…"></textarea></label>${e.kind==='course'?'<label>Katılımcı sayısı<select name="people"><option>1</option><option>2</option></select></label>':''}<p class="meta">Gerçek kişi veya iletişim bilgisi girmene gerek yok.</p><button class="btn primary">${isMessage?'Demo sorusunu kaydet':'Demo talebini kaydet'}</button></form></div>`)}
function reportForm(id){showModal('İçerik bildir',`<h1>İncelenmesi gereken ne var?</h1><form class="form" data-form="report" data-id="${esc(id)}"><label>Bildirim nedeni<select name="reason">${options(['Yanıltıcı bilgi','Sahte / izinsiz ürün','Uygunsuz içerik','Telif veya kişisel veri','Diğer'])}</select></label><label>Açıklama<textarea name="note" required minlength="5" maxlength="600"></textarea></label><p class="notice">Bildirim demo moderasyon kuyruğuna eklenir. İçerik, karar verilene kadar yayında kalır.</p><button class="btn primary">Bildirimi demo kuyruğuna ekle</button></form>`)}
function mediaForm(listing=''){showModal('Kullananlardan · Deneyim ekle',`<h1>Hobinin hayatındaki yerini göster.</h1><p class="muted">Demo için hazır görsellerden birini seç. Gerçek dosya yüklenmez.</p><form class="form" data-form="media" data-id="${esc(listing)}"><label>Başlık<input name="title" required minlength="4" maxlength="100" placeholder="Benim bitki köşem"></label><label>Deneyimin<textarea name="desc" required minlength="10" maxlength="800"></textarea></label><label>Örnek görsel<select name="image">${options([{id:'0',name:'Monstera'},{id:'1',name:'Anthurium'},{id:'2',name:'Akvaryum'},{id:'3',name:'Karides'},{id:'4',name:'Saat'},{id:'6',name:'3D atölyesi'},{id:'7',name:'Maker saksılar'}],String(hub().image))}</select></label><label class="row"><input type="checkbox" required name="rights"> Paylaşımımda kişisel veri ve izinsiz içerik bulunmadığını onaylıyorum.</label><button class="btn primary">Moderasyona gönder · Demo</button></form>`)}
function attributeFields(h,cat){return h.attributes.filter(a=>!a.category||descendants(a.category,h).has(cat)).map(a=>`<label>${esc(a.name)} ${a.unit?'('+esc(a.unit)+')':''}${a.required?' *':''}${['select','boolean','multi'].includes(a.type)?`<select name="attr_${a.id}" ${a.required?'required':''} ${a.type==='multi'?'multiple':''}><option value="">Seç</option>${options(a.type==='boolean'?['Evet','Hayır']:a.options)}</select>`:`<input name="attr_${a.id}" type="${a.type==='number'?'number':'text'}" ${a.type==='number'?'min="0" step="any"':''} ${a.required?'required':''} maxlength="120">`}</label>`).join('')}
function listingForm(hid=state.hub){const h=hub(hid);showModal('Yeni ilan · Yerel demo',`<h1>Hobinden bir parça paylaş.</h1><form class="form" data-form="listing"><div class="grid2"><label>Hobi<select name="hub" id="listing-hub">${options(data.hubs.filter(h=>h.active),hid)}</select></label><label>Kategori<select name="cat" id="listing-cat" required><option value="">Kategori seç</option>${options(allNodes(h).map(c=>({id:c.id,name:path(c.id,h)})))}</select></label></div><label>İlan başlığı<input name="title" required minlength="5" maxlength="100" placeholder="Örn. Köklü Monstera albo çeliği"></label><div class="grid2"><label>Fiyat · TL<input name="price" type="number" min="1" max="10000000" required></label><label>İlan türü<select name="type">${options(h.listingTypes)}</select></label><label>Konum<select name="city">${options(['İstanbul','Ankara','İzmir','Bursa'])}</select></label><label>Teslimat<select name="delivery">${options(['Elden teslim','Kargo','Kargo veya elden'])}</select></label></div><div class="grid2" id="dynamic-attributes">${attributeFields(h,'')}</div><label>Açıklama<textarea name="desc" required minlength="20" maxlength="1500" placeholder="Ürünün durumunu ve önemli ayrıntıları belirt."></textarea></label><p class="notice">Hazır temsili görsel atanır. İlan, backoffice’te onaylanana kadar görünmez.</p><button class="btn primary">İncelemeye gönder · Demo</button></form>`)}
function help(){showModal('Demo rehberi',`<h1>Hobby Hub’ı 5 dakikada dene.</h1><ol class="stack"><li><b>Bir hobi seç.</b> Soldan alt kategoriye in; fiyat, tür ve hobiye özel filtreleri uygula.</li><li><b>Aramayı dene.</b> “Monstera”, “saat” veya “kurulum” yaz. Üstteki kapsamı değiştirerek bütün hobilerde ara.</li><li><b>Bir ilanı aç.</b> Satıcı vitrini, kullananlardan galerisi, kaydetme ve yerel soru formunu dene.</li><li><b>Uzmanlar ve etkinliklere bak.</b> Teklif veya katılım talebi oluştur; fırsat kuponunu göster.</li><li><b>Backoffice’e geç.</b> Yeni hobi, kategori veya özellik ekle. Bölümleri sırala; “Yayınla · Demo” ile ziyaretçi görünümüne taşı.</li><li><b>Moderasyonu test et.</b> “İlan ver” veya “Deneyimini paylaş” ile kayıt oluştur; moderasyondan onayla.</li></ol><p class="notice">Bütün veriler örnektir. Gerçek hesap, ödeme, kargo, mesaj iletimi veya güvenli yönetici erişimi yoktur. Yerel kayıt ${storageOK?'açık':'kullanılamıyor'}.</p><div class="row section">${btn('Yapılandırılmış demoyu indir','export','','btn primary')}${btn('Backoffice’i aç','admin')}</div><p class="terms section">İndirilen HTML mevcut demo verilerini içerir. Arkadaşların dosyayı bilgisayara indirip Chrome, Safari veya Edge’de açabilir. E-posta önizlemesinde etkileşimler çalışmayabilir. Her tarayıcının verisi ayrıdır; ortak veritabanı yoktur.</p>`)}
function adminView(){const menu={overview:'Genel bakış',hubs:'Hobiler',tree:'Kategori ağacı',schema:'Özellikler & filtreler',sections:'Bölümler & sıralama',content:'İçerik & öne çıkarma',moderation:'Moderasyon',log:'İşlem geçmişi'};const h=hub(state.adminHub,true)||data.draftHubs[0];state.adminHub=h.id;return `<div class="shell admin-shell"><aside class="admin-side"><h2>Yönetim alanı</h2>${Object.entries(menu).map(([id,n])=>btn(n,'admin-tab',id,'btn '+(state.adminTab===id?'active':''))).join('')}<div class="notice section">Demo yönetimi açıktır.<br>Gerçek yetkilendirme içermez.</div></aside><main id="main" class="admin-main"><div class="adminbar"><div><div class="eyebrow muted">Hobby Hub / Backoffice</div><h1 style="margin:8px 0 0">${menu[state.adminTab]||menu.overview}</h1><p class="muted">Yayın revizyonu ${data.revision} · Yapılandırma değişiklikleri taslakta tutulur.</p></div><div class="row">${btn('Ziyaretçi görünümü','exit-admin','','btn')}${btn('Yayınla · Demo','publish','','btn primary')}</div></div>${!storageOK?'<p class="notice">Tarayıcı kaydı kullanılamıyor. İndirerek sakla.</p>':''}${!['overview','log','moderation'].includes(state.adminTab)?`<div class="row between" style="margin-bottom:22px"><label>Hobi seç<select class="admin-select" id="admin-hub">${options(data.draftHubs,h.id)}</select></label><span class="pill">Taslak yapılandırma</span></div>`:''}${adminContent(h)}</main></div>`}
function adminContent(h){switch(state.adminTab){case 'overview':return `<div class="grid3"><div class="metric"><strong>${data.hubs.filter(h=>h.active).length}</strong><span>Yayındaki hobi</span></div><div class="metric"><strong>${data.listings.filter(visibleListing).length}</strong><span>Yayındaki örnek ilan</span></div><div class="metric"><strong>${data.listings.filter(l=>l.status==='pending').length+data.entities.filter(e=>e.status==='pending').length+data.reports.filter(r=>r.status==='pending').length}</strong><span>Moderasyonda bekleyen</span></div></div><div class="grid2 section"><section class="panel"><h2>Bir hobi nasıl açılır?</h2><ol class="stack"><li>Hobi adı ve giriş metnini tanımla.</li><li>Kategori ağacı ve ilan türlerini oluştur.</li><li>Özellikleri, filtreleri ve görünür bölümleri seç.</li><li>Yayınla; ardından örnek ilan ve içerik ekle.</li></ol>${btn('Hobi oluştur','new-hub','','btn primary')}</section><section class="panel"><h2>Demo çalışma alanı</h2><p>Şema, bölüm ve kategori taslaklarını yayınlayınca ziyaretçi ekranları değişir. İçerik ve moderasyon işlemleri kaydedildiğinde yerel demoya hemen yansır.</p><div class="stack">${btn('Mevcut demoyu HTML olarak indir','export')}${btn('Önceki yapılandırmaya dön','rollback')}${btn('Başlangıç verisine dön…','reset','','btn danger')}</div></section></div><section class="panel section"><h2>Yerel talepler</h2>${data.requests.length?`<div class="tablewrap"><table class="admin-table"><thead><tr><th>Kayıt</th><th>Mesaj</th><th>Durum</th></tr></thead><tbody>${data.requests.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.message)}</td><td>Demo alındı · İletilmedi</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Henüz demo soru, teklif veya katılım talebi yok.</p>'}</section>`;
case 'hubs':return `<div class="row between"><p class="muted">Yeni hobi, mevcut ekran şablonlarıyla çalışır.</p>${btn('+ Yeni hobi','new-hub','','btn primary')}</div><section class="panel"><form class="form" data-form="hub" data-id="${h.id}"><div class="grid2"><label>Hobi adı<input name="name" value="${esc(h.name)}" maxlength="40" required></label><label>Kısa simge<input name="symbol" value="${esc(h.symbol)}" maxlength="4" required></label></div><label>Üst etiket<input name="kicker" value="${esc(h.kicker)}" maxlength="60" required></label><label>Hub başlığı<input name="headline" value="${esc(h.headline)}" maxlength="80" required></label><label>Açıklama<input name="subtitle" value="${esc(h.subtitle)}" maxlength="160" required></label><label>İlan türleri · virgülle ayır<input name="listingTypes" value="${esc(h.listingTypes.join(', '))}" required maxlength="250"></label><label class="row"><input type="checkbox" name="active" ${h.active?'checked':''}> Ziyaretçi menüsünde aktif</label><div class="form-footer"><button class="btn primary">Taslağı kaydet</button></div></form></section>`;
case 'tree':return `<div class="row between"><p class="muted">Üst kategori seçerek taşı. Alt dallar ve ilan bağları korunur.</p>${btn('+ Kategori ekle','new-category','','btn primary')}</div><section class="panel">${h.categories.length?adminTree(h):'<p>Henüz kategori yok.</p>'}</section><p class="meta section">Döngü oluşturan taşıma engellenir. Kategori silme ve birleştirme bu demoda yoktur.</p>`;
case 'schema':return `<div class="row between"><p class="muted">Özellik şeması ilan formunu; filtre ayarı sol paneli üretir.</p>${btn('+ Özellik ekle','new-attribute','','btn primary')}</div><section class="panel tablewrap"><table class="admin-table"><thead><tr><th>Özellik</th><th>Tür / kapsam</th><th>Zorunlu</th><th>Filtre</th><th></th></tr></thead><tbody>${h.attributes.map(a=>`<tr><td><b>${esc(a.name)}</b><br><small>${esc(a.options.join(', ')||a.unit||'Serbest değer')}</small></td><td>${esc(a.type)}<br><small>${a.category?esc(path(a.category,h)):'Tüm kategoriler'}</small></td><td>${a.required?'Evet':'Hayır'}</td><td>${a.filterable?'Açık':'Kapalı'}</td><td>${btn('Düzenle','edit-attribute',a.id,'btn small')}</td></tr>`).join('')}</tbody></table></section><p class="notice section">Demo veri kaybını önlemek için mevcut özelliğin tipi değiştirilmez. Üretimde tip değişikliği yeni şema sürümü ve veri göçü gerektirir.</p>`;
case 'sections':return `<section class="panel"><h2>Hub’ın bölüm düzeni</h2><p class="muted">Keşfet sayfası bu sırayı kullanır. Kapalı bölümler sekmelerden ve global aramadan çıkar.</p>${h.sections.map((s,i)=>`<div class="order-row"><label class="row"><input type="checkbox" data-section="${s.id}" ${s.enabled?'checked':''}> ${tabNames[s.id]}</label><button class="btn small" data-action="section-up" data-id="${s.id}" ${i===0?'disabled':''} aria-label="${tabNames[s.id]} yukarı taşı">↑</button><button class="btn small" data-action="section-down" data-id="${s.id}" ${i===h.sections.length-1?'disabled':''} aria-label="${tabNames[s.id]} aşağı taşı">↓</button></div>`).join('')}</section>`;
case 'content':{const es=data.entities.filter(e=>e.hub===h.id),ls=data.listings.filter(l=>l.hub===h.id);return `<div class="row between"><p class="muted">Bu alandaki kayıtlar ve öne çıkarma yerel demoya hemen yansır.</p>${btn('+ İçerik / hizmet ekle','new-entity','','btn primary')}</div><section class="panel tablewrap"><table class="admin-table"><thead><tr><th>Kayıt</th><th>Tür</th><th>Durum</th><th>Öne çıkar</th><th></th></tr></thead><tbody>${[...es,...ls].map(e=>`<tr><td>${esc(e.title)}</td><td>${kindNames[e.kind]||'İlan'}</td><td>${statusNames[e.status]}</td><td><input type="checkbox" data-promote="${e.id}" aria-label="${esc(e.title)} sponsorlu göster" ${e.promoted?'checked':''}></td><td>${e.kind?btn('Düzenle','edit-entity',e.id,'btn small'):''}</td></tr>`).join('')}</tbody></table></section><p class="meta section">Öne çıkarılan kayıtlar “Sponsorlu” etiketi taşır. Ödeme, zamanlama ve kampanya bütçesi bu prototipte yoktur.</p>`}
case 'moderation':{const pending=[...data.listings,...data.entities].filter(e=>e.status==='pending'),reports=data.reports.filter(r=>r.status==='pending');return `<p class="notice">Onaylanan örnek kayıt ziyaretçi ekranına eklenir. Ret ve gizleme için karar gerekçesi istenir.</p><section class="panel section"><h2>Yeni kayıtlar <small>(${pending.length})</small></h2>${pending.length?pending.map(e=>`<div class="mini" style="margin-bottom:12px">${photo(e.image)}<div class="inside"><h3>${esc(e.title)}</h3><p class="meta">${esc(hub(e.hub)?.name||'Taslak hobi')} · ${kindNames[e.kind]||'İlan'}</p><p style="font-size:14px">${esc(e.desc)}</p></div><div class="stack">${btn('İncele & karar ver','moderate',e.id,'btn small')}</div></div>`).join(''):'<p class="muted">Yeni kayıt kuyruğu boş.</p>'}</section><section class="panel section"><h2>Bildirilen içerikler <small>(${reports.length})</small></h2>${reports.length?reports.map(r=>`<div class="mini" style="margin-bottom:12px"><div class="inside"><h3>${esc([...data.listings,...data.entities].find(e=>e.id===r.item)?.title||r.item)}</h3><p>${esc(r.reason)}</p><p class="meta">${esc(r.note)}</p></div>${btn('Bildirimi incele','moderate-report',r.id,'btn small')}</div>`).join(''):'<p class="muted">Bekleyen bildirim yok.</p>'}</section><section class="panel section"><h2>Son kararlar</h2>${data.decisions.length?data.decisions.slice(0,8).map(d=>`<p><b>${esc(d.title)}</b> · ${esc(d.result)}<br><small>${esc(d.reason)} · ${esc(d.at)}</small></p>`).join(''):'<p class="muted">Henüz karar verilmedi.</p>'}</section>`}
case 'log':return `<section class="panel"><h2>Bu tarayıcıdaki işlem geçmişi</h2><p class="meta">Demo günlüğüdür; değiştirilemez üretim denetim kaydı değildir.</p>${data.audit.length?data.audit.map(a=>`<p><small>${esc(a.at)}</small><br>${esc(a.action)}</p>`).join(''):'Henüz işlem yok.'}</section>`;default:return ''}}
function adminTree(h,parent=''){return h.categories.filter(c=>c.parent===parent).map(c=>`<div class="admin-tree"><div class="row"><span>${esc(c.name)}</span>${btn('Düzenle / taşı','edit-category',c.id,'btn small')}</div>${adminTree(h,c.id)}</div>`).join('')}
function newHub(){showModal('Yeni hobi',`<h1>Yeni bir merak alanı aç.</h1><form class="form" data-form="new-hub"><label>Hobi adı<input name="name" required minlength="2" maxlength="40" placeholder="Örn. Parfüm"></label><label>Başlık<input name="headline" required maxlength="80" placeholder="Yeni kokular, yeni hikâyeler."></label><p class="notice">Taslak hobiye bir başlangıç kategorisi ve ortak ilan türleri eklenir. Ardından özelliklerini tanımlayabilirsin.</p><button class="btn primary">Taslak hobi oluştur</button></form>`)}
function categoryForm(id=''){const h=hub(state.adminHub,true),c=h.categories.find(c=>c.id===id)||{name:'',parent:''};const excluded=id?descendants(id,h):new Set;showModal(id?'Kategori düzenle':'Kategori ekle',`<form class="form" data-form="category" data-id="${id}"><label>Kategori adı<input name="name" value="${esc(c.name)}" required minlength="2" maxlength="60"></label><label>Üst kategori<select name="parent"><option value="">Ana kategori</option>${options(h.categories.filter(n=>!excluded.has(n.id)).map(n=>({id:n.id,name:path(n.id,h)})),c.parent)}</select></label><p class="meta">Mevcut ilanların kategori kimliği değişmez.</p><button class="btn primary">Kategori taslağını kaydet</button></form>`)}
function attributeForm(id=''){const h=hub(state.adminHub,true),a=h.attributes.find(a=>a.id===id)||{name:'',type:'select',options:[],unit:'',filterable:true,required:false,category:''};showModal(id?'Özellik düzenle':'Özellik ekle',`<form class="form" data-form="attribute" data-id="${id}"><div class="grid2"><label>Özellik adı<input name="name" value="${esc(a.name)}" required maxlength="40"></label><label>Veri tipi<select name="type" ${id?'disabled':''}>${options([{id:'select',name:'Seçim listesi'},{id:'multi',name:'Çoklu seçim'},{id:'number',name:'Sayı'},{id:'boolean',name:'Evet / Hayır'},{id:'text',name:'Metin'}],a.type)}</select></label></div><label>Kategori kapsamı<select name="category"><option value="">Tüm kategoriler</option>${options(h.categories.map(c=>({id:c.id,name:path(c.id,h)})),a.category)}</select></label><label>Seçenekler · virgülle ayır<input name="options" value="${esc(a.options.join(', '))}" maxlength="350" placeholder="Düşük, Orta, Yüksek"></label><label>Birim · sayısal alanlar için<input name="unit" value="${esc(a.unit)}" maxlength="12" placeholder="mm, L, cm"></label><label class="row"><input name="required" type="checkbox" ${a.required?'checked':''}> Yeni ilanlarda zorunlu</label><label class="row"><input name="filterable" type="checkbox" ${a.filterable?'checked':''}> Sol panelde filtre olarak göster</label><p class="meta">Metin özellikleri serbest giriş içindir ve filtreye açılmaz. Sayı filtresi demoda mevcut değerler üzerinden seçilir.</p><p class="form-error" role="alert"></p><button class="btn primary">Özellik taslağını kaydet</button></form>`)}
function entityForm(id=''){const e=data.entities.find(e=>e.id===id)||{kind:'content',title:'',desc:'',source:'',seller:'',city:'İstanbul',url:'',status:'pending',price:0,date:'24 Ekim 2026 · 14.00',capacity:8,tag:'',terms:''};showModal(id?'İçerik düzenle':'İçerik / hizmet ekle',`<form class="form" data-form="entity" data-id="${id}"><div class="grid2"><label>İçerik türü<select name="kind">${options(Object.entries(kindNames).map(([id,name])=>({id,name})),e.kind)}</select></label><label>Durum<select name="status">${options(Object.entries(statusNames).map(([id,name])=>({id,name})),e.status)}</select></label></div><label>Başlık<input name="title" value="${esc(e.title)}" required minlength="5" maxlength="100"></label><label>Açıklama<textarea name="desc" required minlength="15" maxlength="1500">${esc(e.desc)}</textarea></label><div class="grid2"><label>Kaynak / yayıncı<input name="source" value="${esc(e.source)}" required maxlength="70"></label><label>Sağlayıcı / satıcı<input name="seller" value="${esc(e.seller)}" required maxlength="60"></label><label>Konum<input name="city" value="${esc(e.city)}" required maxlength="50"></label><label>Kart etiketi<input name="tag" value="${esc(e.tag)}" maxlength="30"></label></div><label>Kaynak adresi · isteğe bağlı<input name="url" type="url" value="${esc(e.url)}" placeholder="https://…"></label><div class="grid2"><label>Hizmet / etkinlik ücreti · TL<input name="price" type="number" min="0" max="10000000" value="${e.price||0}"></label><label>Etkinlik kontenjanı<input name="capacity" type="number" min="0" max="10000" value="${e.capacity??8}"></label></div><label>Etkinlik tarihi<input name="date" value="${esc(e.date||'24 Ekim 2026 · 14.00')}" maxlength="80"></label><label>Fırsat koşulları<textarea name="terms" maxlength="500">${esc(e.terms||'')}</textarea></label><p class="notice">Kayıt seçili hobiye eklenir. “Yayında” kaydetmek yerel ziyaretçi görünümünü hemen değiştirir. İnternet kaynağından otomatik içerik çekilmez.</p><p class="form-error" role="alert"></p><button class="btn primary">İçeriği kaydet · Demo</button></form>`)}
function moderationForm(id,isReport=false){const report=isReport?data.reports.find(r=>r.id===id):null;const e=[...data.listings,...data.entities].find(e=>e.id===(report?report.item:id));showModal('Moderasyon kararı',`<h1>${esc(e?.title||'Kayıt')}</h1><p>${esc(e?.desc||'')}</p>${e?photo(e.image,'','İncelenen temsili görsel'):''}<form class="form section" data-form="moderation" data-id="${id}" data-report="${isReport}"><label>Karar<select name="decision">${options(isReport?[{id:'dismiss',name:'Bildirimi kapat · içerik yayında kalsın'},{id:'hide',name:'İçeriği gizle'}]:[{id:'approve',name:'Onayla ve yayınla'},{id:'reject',name:'Reddet'}])}</select></label><label>Karar gerekçesi<textarea name="reason" required minlength="5" maxlength="500"></textarea></label><button class="btn primary">Kararı uygula · Demo</button></form>`)}
function publish(){const hs=data.draftHubs;if(!hs.some(h=>h.active)){toast('En az bir hobi aktif olmalı.');return}for(const h of hs){if(!h.categories.length||!h.listingTypes.length){toast(h.name+': kategori ve ilan türü gerekli.');return}if(h.categories.some(c=>c.parent&&!node(c.parent,h))){toast('Geçersiz üst kategori var.');return}if(!h.sections.some(s=>s.enabled)){toast(h.name+': en az bir bölüm açık olmalı.');return}}data.previousHubs=copy(data.hubs);data.hubs=copy(hs);data.revision++;audit('Hobi yapılandırması yayınlandı · revizyon '+data.revision);state.filters={};state.cat='';render();toast('Taslak yapılandırma ziyaretçi görünümüne yansıdı. · Revizyon '+data.revision)}
function exportDemo(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#initial-data').textContent=JSON.stringify(data).replace(/</g,'\\u003c');clone.querySelector('#app').innerHTML='';clone.querySelector('#modal').removeAttribute('open');clone.querySelector('#modal-body').innerHTML='';clone.querySelector('#toast').classList.add('hidden');const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hobby-hub-demo.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Mevcut verilerle HTML indirmesi başlatıldı.')}
function favorite(id){data.favorites=data.favorites.includes(id)?data.favorites.filter(x=>x!==id):[...data.favorites,id];save();render();$$(`[data-action="favorite"][data-id="${id}"]`).forEach(b=>{if(b.classList.contains('fav'))return;b.textContent=data.favorites.includes(id)?'♥ Kaydedildi':'♡ Kaydet'});toast(data.favorites.includes(id)?'Kaydettiklerine eklendi.':'Kayıt kaldırıldı.')}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const a=target.dataset.action,id=target.dataset.id;switch(a){case'home':goHub(data.hubs.find(h=>h.active).id);break;case'hub':goHub(id);break;case'tab':state.tab=id;state.favorites=false;render();break;case'category':state.cat=id;state.tab='market';state.filters={};state.favorites=false;state.searching=false;state.query='';render();break;case'clear-filters':state.filters={};render();break;case'remove-filter':delete state.filters[id];render();break;case'all-listings':state.filters={};state.cat='';state.query='';state.searching=false;state.tab='market';render();break;case'listing':listingDetail(id);break;case'favorite':favorite(id);break;case'favorites':closeModal();state.favorites=true;state.searching=true;state.scope='all';state.query='';state.tab='market';state.filters={};state.cat='';state.admin=false;render();break;case'favorites-all':state.searching=true;state.scope='all';state.filters={};state.cat='';render();break;case'entity':entityDetail(id);break;case'seller':sellerProfile(id);break;case'follow':data.following=data.following.includes(id)?data.following.filter(x=>x!==id):[...data.following,id];save();sellerProfile(id);break;case'gallery':showModal('Galeride · AI ile üretilmiş temsili görsel',photo(Number(id))+'<p class="meta section">Gerçek bir alıcı veya işlemle ilişkili değildir.</p>');break;case'close':closeModal();break;case'message':requestForm(id,true);break;case'request':requestForm(id);break;case'report':reportForm(id);break;case'add-media':mediaForm(id||'');break;case'coupon':target.outerHTML='<div class="success"><b>HOBBYDEMO10</b><p>Örnek kupon gösterildi. Gerçek alışverişte geçerli değildir.</p></div>';break;case'create-listing':state.admin=false;listingForm();break;case'help':help();break;case'filters-open':$('#sidebar').classList.add('open');break;case'filters-close':$('#sidebar').classList.remove('open');break;case'save-search':{const value={hub:state.hub,cat:state.cat,filters:copy(state.filters),q:state.query,scope:state.scope};if(!data.savedSearches.some(s=>JSON.stringify(s)===JSON.stringify(value)))data.savedSearches.push(value);save();toast('Arama bu tarayıcıda kaydedildi. Demo bildirimi gönderilmez.');showModal('Kaydedilen aramalar',`<h1>Aramalarım</h1>${data.savedSearches.map((s,i)=>`<div class="mini"><div class="inside"><b>${esc(s.q||path(s.cat,hub(s.hub))||hub(s.hub).name)}</b><p class="meta">${esc(Object.values(s.filters).join(' · ')||'Ek filtre yok')}</p></div>${btn('Aramayı aç','load-search',String(i),'btn small')}</div>`).join('')}`);break}case'load-search':{const s=data.savedSearches[Number(id)];state={...state,hub:s.hub,cat:s.cat,filters:copy(s.filters),query:s.q,scope:s.scope,searching:!!s.q,tab:'market',favorites:false};closeModal();render();break}case'admin':closeModal();state.admin=true;render();break;case'exit-admin':state.admin=false;render();break;case'admin-tab':state.adminTab=id;render();break;case'new-hub':newHub();break;case'new-category':categoryForm();break;case'edit-category':categoryForm(id);break;case'new-attribute':attributeForm();break;case'edit-attribute':attributeForm(id);break;case'new-entity':entityForm();break;case'edit-entity':entityForm(id);break;case'section-up':case'section-down':{const h=hub(state.adminHub,true),i=h.sections.findIndex(s=>s.id===id),j=i+(a==='section-up'?-1:1);if(j>=0&&j<h.sections.length){[h.sections[i],h.sections[j]]=[h.sections[j],h.sections[i]];audit('Bölüm sırası taslağı güncellendi: '+h.name);render()}break}case'publish':publish();break;case'moderate':moderationForm(id);break;case'moderate-report':moderationForm(id,true);break;case'rollback':if(data.previousHubs){const prev=copy(data.hubs);data.hubs=copy(data.previousHubs);data.previousHubs=prev;data.draftHubs=copy(data.hubs);data.revision++;state.adminHub=data.hubs[0].id;audit('Önceki yapılandırma geri yüklendi');render();toast('Önceki yapılandırma geri yüklendi.')}else toast('Geri dönülecek yayın henüz yok.');break;case'export':exportDemo();break;case'reset':showModal('Demo verisini sıfırla',`<h1>Başlangıca dönülsün mü?</h1><p>Bu tarayıcıdaki demo değişiklikleri, favoriler ve kayıtlar sıfırlanır. İstersen önce mevcut HTML’yi indir.</p><div class="row">${btn('Önce mevcut demoyu indir','export')}${btn('Sıfırla','confirm-reset','','btn danger')}</div>`);break;case'confirm-reset':data=copy(seed);save();closeModal();state.adminHub=data.draftHubs[0].id;goHub(data.hubs[0].id);toast('Başlangıç demo verisi geri yüklendi.');break;}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.filter){state.filters[el.dataset.filter]=el.value;state.tab='market';render()}else if(el.id==='sort'){state.sort=el.value;render()}else if(el.id==='admin-hub'){state.adminHub=el.value;render()}else if(el.dataset.section){hub(state.adminHub,true).sections.find(s=>s.id===el.dataset.section).enabled=el.checked;audit('Bölüm görünürlüğü taslağı değiştirildi.')}else if(el.dataset.promote){const e=[...data.entities,...data.listings].find(e=>e.id===el.dataset.promote);e.promoted=el.checked;audit('Öne çıkarma değişti: '+e.title);toast('Sponsorlu görünüm güncellendi.')}else if(el.id==='listing-hub'){listingForm(el.value)}else if(el.id==='listing-cat'){$('#dynamic-attributes').innerHTML=attributeFields(hub($('#listing-hub').value),el.value)}});
document.addEventListener('submit',event=>{event.preventDefault();const f=event.target,form=new FormData(f),v=Object.fromEntries(form.entries()),type=f.dataset.form,id=f.dataset.id||'';if(f.id==='search-form'){state.query=$('#search-input').value.trim();state.scope=$('#search-scope').value;state.searching=!!state.query;state.favorites=false;state.cat='';state.filters={};state.admin=false;state.tab='discover';if(state.scope!=='all')state.hub=state.scope;render();return}if(f.id==='price-form'){if(v.min&&v.max&&Number(v.min)>Number(v.max)){toast('En az fiyat, en çok fiyattan büyük olamaz.');return}state.filters.min=v.min;state.filters.max=v.max;state.tab='market';render();return}function error(msg){const field=f.querySelector('.form-error');if(field)field.textContent=msg;else toast(msg)}
switch(type){case'listing':{const h=hub(v.hub);if(!h||!node(v.cat,h))return error('Geçerli kategori seç.');const attrs={};for(const a of h.attributes){const values=form.getAll('attr_'+a.id).filter(Boolean);if(a.required&&(!a.category||descendants(a.category,h).has(v.cat))&&!values.length)return error(a.name+' gerekli.');attrs[a.id]=values.join(',')}data.listings.push({id:uid(),hub:h.id,cat:v.cat,title:v.title.trim(),price:Number(v.price),type:v.type,city:v.city,delivery:v.delivery,desc:v.desc.trim(),attrs,condition:v.type==='İkinci el'?'İkinci el':'Yeni',seller:'Demo Üretici',sellerBio:'Hobimden ürettiklerim ve koleksiyonum.',image:h.image,status:'pending',promoted:false});audit('Yeni örnek ilan moderasyona gönderildi: '+v.title);showModal('İlan alındı',`<div class="success"><h2>İlanın inceleme sırasında.</h2><p>Ziyaretçiler henüz göremez. Backoffice → Moderasyon bölümünden onaylayabilirsin.</p>${btn('Moderasyonu aç','admin')}</div>`);state.adminTab='moderation';break}
case'request':{const e=[...data.entities,...data.listings].find(e=>e.id===id);data.requests.push({id:uid(),item:id,title:e.title,message:v.message,people:Number(v.people||1),status:'demo-received'});audit('Yerel demo talebi kaydedildi: '+e.title);showModal('Demo talebi kaydedildi',`<div class="success"><h2>Talebin demo kaydına eklendi.</h2><p>Hiç kimseye iletilmedi. ${e.kind==='course'?'Rezervasyon kesinleşmedi ve kontenjan düşülmedi.':''} Backoffice genel bakışta görebilirsin.</p>${btn('Kapat','close','','btn primary')}</div>`);break}
case'report':data.reports.push({id:uid(),item:id,reason:v.reason,note:v.note,status:'pending'});audit('Demo içerik bildirimi alındı.');showModal('Bildirim alındı','<div class="success"><h2>Bildirim inceleme kuyruğunda.</h2><p>Backoffice → Moderasyon bölümünde karar verilebilir.</p></div>');break;
case'media':{const l=data.listings.find(l=>l.id===id);data.entities.push({id:uid(),kind:'community',hub:l?.hub||state.hub,listing:id,title:v.title,desc:v.desc,summary:v.desc.slice(0,100),image:Number(v.image),seller:'Demo Üye',source:'Kullananlardan',tag:'Deneyim',city:l?.city||'İstanbul',status:'pending',promoted:false});audit('Kullanım paylaşımı moderasyona gönderildi.');showModal('Paylaşım alındı','<div class="success"><h2>Deneyimin inceleme sırasında.</h2><p>Onaydan sonra Topluluk bölümünde ve bağlı olduğu ilanın galerisinde görünür.</p></div>');break}
case'new-hub':{if(data.draftHubs.some(h=>fold(h.name)===fold(v.name)))return error('Bu isimde hobi zaten var.');const hid=uid();data.draftHubs.push({id:hid,name:v.name.trim(),symbol:'◇',kicker:'Yeni bir merak',headline:v.headline.trim(),subtitle:'Keşfet, öğren ve topluluğunla paylaş.',active:true,image:7,categories:[{id:uid(),name:'Genel',parent:''}],listingTypes:['Kendi üretimi','İkinci el','Koleksiyon'],attributes:[],sections:copy(seed.hubs[0].sections)});state.adminHub=hid;state.adminTab='hubs';audit('Yeni hobi taslağı oluşturuldu: '+v.name);closeModal();render();toast('Hobi taslağı hazır. Yayınlayınca menüde görünecek.');break}
case'hub':{const h=hub(id,true),types=v.listingTypes.split(',').map(x=>x.trim()).filter(Boolean);if(!types.length)return error('En az bir ilan türü gerekli.');if(data.draftHubs.some(x=>x.id!==id&&fold(x.name)===fold(v.name)))return error('Bu hobi adı kullanılıyor.');Object.assign(h,{name:v.name.trim(),symbol:v.symbol,kicker:v.kicker,headline:v.headline,subtitle:v.subtitle,listingTypes:[...new Set(types)],active:!!v.active});audit('Hobi taslağı kaydedildi: '+h.name);render();toast('Taslak kaydedildi. Ziyaretçiye yansıtmak için yayınla.');break}
case'category':{const h=hub(state.adminHub,true);if(v.parent&&!node(v.parent,h))return error('Üst kategori bulunamadı.');if(id&&descendants(id,h).has(v.parent))return error('Kategori kendi altına taşınamaz.');if(h.categories.some(c=>c.id!==id&&c.parent===v.parent&&fold(c.name)===fold(v.name)))return error('Bu dalda aynı adlı kategori var.');const c=h.categories.find(c=>c.id===id);if(c)Object.assign(c,{name:v.name.trim(),parent:v.parent});else h.categories.push({id:uid(),name:v.name.trim(),parent:v.parent});audit('Kategori taslağı kaydedildi: '+v.name);closeModal();render();break}
case'attribute':{const h=hub(state.adminHub,true),old=h.attributes.find(a=>a.id===id),atype=old?.type||v.type,opts=[...new Set(v.options.split(',').map(x=>x.trim()).filter(Boolean))];if(['select','multi'].includes(atype)&&!opts.length)return error('Seçim listesi için en az bir seçenek gir.');if(h.attributes.some(a=>a.id!==id&&fold(a.name)===fold(v.name)))return error('Bu adla özellik zaten var.');const obj={id:old?.id||uid(),name:v.name.trim(),type:atype,options:opts,unit:v.unit,category:v.category,required:!!v.required,filterable:atype!=='text'&&!!v.filterable};if(old)Object.assign(old,obj);else h.attributes.push(obj);audit('Özellik taslağı kaydedildi: '+v.name);closeModal();render();break}
case'entity':{let url='';if(v.url){try{const u=new URL(v.url);if(u.protocol!=='https:')throw Error();url=u.href}catch(e){return error('Kaynak adresi https:// ile başlamalı.')}}if(!hub(state.adminHub))return error('İçerik eklemeden önce yeni hobiyi yayınla.');const old=data.entities.find(e=>e.id===id);const obj={id:old?.id||uid(),hub:old?.hub||state.adminHub,kind:v.kind,title:v.title,desc:v.desc,summary:v.desc.slice(0,100),source:v.source,seller:v.seller,city:v.city,tag:v.tag,url,status:v.status,price:Number(v.price),capacity:Number(v.capacity),date:v.date,terms:v.terms,image:old?.image??hub(state.adminHub).image,promoted:old?.promoted||false};if(old)Object.assign(old,obj);else data.entities.push(obj);audit('İçerik kaydedildi: '+v.title);closeModal();render();toast('İçerik yerel demoda kaydedildi.');break}
case'moderation':{const isReport=f.dataset.report==='true',r=isReport?data.reports.find(r=>r.id===id):null,e=[...data.listings,...data.entities].find(e=>e.id===(r?r.item:id));if(!e)return error('Kayıt bulunamadı.');if(isReport){r.status='resolved';if(v.decision==='hide')e.status='hidden'}else e.status=v.decision==='approve'?'published':'rejected';const result={approve:'Onaylandı',reject:'Reddedildi',hide:'Gizlendi',dismiss:'Bildirim kapatıldı'}[v.decision];data.decisions.unshift({title:e.title,result,reason:v.reason,at:new Date().toLocaleString('tr-TR')});audit(result+': '+e.title);closeModal();render();toast('Karar uygulandı: '+result);break}}});

if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'navigate_hobby',title:'Hobi sayfasını aç',description:'Yerel Hobby Hub demosunda belirtilen hobinin keşfet sayfasını açar.',inputSchema:{type:'object',properties:{hobbyId:{type:'string'}},required:['hobbyId'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||typeof input.hobbyId!=='string'||!hub(input.hobbyId)?.active)throw new Error('Geçerli ve aktif hobi kimliği gerekli.');goHub(input.hobbyId);return{hobbyId:state.hub,title:hub().name,tab:state.tab}}})).catch(()=>{});}catch(e){}}
